baseURL = "https://example.com"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Lumin Blog"
theme = "lumin"

# Enable emoji
enableEmoji = true
# Enable Git info
enableGitInfo = true
# Enable robots.txt
enableRobotsTXT = true
# Pagination
paginate = 12
paginatePath = "page"
# Summary length
summaryLength = 150
# Enable unsafe HTML in markdown
[markup.goldmark.renderer]
  unsafe = true

# Highlight code
[markup.highlight]
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = true
  noClasses = false
  style = "github"

# Table of contents
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 10
  
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30
  
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
  
  [[menu.main]]
    identifier = "gallery"
    name = "相册"
    url = "/gallery/"
    weight = 50
  
  [[menu.main]]
    identifier = "movies"
    name = "电影"
    url = "/movies/"
    weight = 55
  
  [[menu.main]]
    identifier = "music"
    name = "音乐"
    url = "/music/"
    weight = 56
  
  [[menu.main]]
    identifier = "diary"
    name = "日记"
    url = "/diary/"
    weight = 57
  
  [[menu.main]]
    identifier = "topics"
    name = "专题"
    url = "/topics/"
    weight = 58
  
  [[menu.main]]
    identifier = "friends"
    name = "友链"
    url = "/friends/"
    weight = 60
  
  [[menu.main]]
    identifier = "guestbook"
    name = "留言"
    url = "/guestbook/"
    weight = 65
  
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 70

# Site parameters
[params]
  # Site info
  author = "博主"
  description = "记录生活，分享技术"
  keywords = ["博客", "技术", "生活"]
  
  # Theme settings
  defaultTheme = "light"  # light, dark, auto
  sidebarPosition = "left"  # left, right
  
  # Header
  [params.header]
    showTitle = true
    showLogo = false
    logo = "/images/logo.png"
  
  # Footer
  [params.footer]
    since = 2024
    icp = ""
    poweredBy = true
    customText = ""
  
  # Banner
  [params.banner]
    enable = true
    title = "Lumin Blog"
    subtitle = "明心静性，爱自己"
    images = ["banner1.jpg", "banner2.jpg", "banner3.jpg"]

    # 主题切换过渡效果 (可选值: ripple / diagonal / blinds / circle / star)
    themeEffect = "circle"
  
  # Profile widget
  [params.profile]
    enable = true
    avatar = "/images/avatar/avatar.png"
    author = "博主"
    bio = "记录生活，分享技术"
    location = "中国"
    organization = ""
  
  # Social links
  [params.social]
    github = ""
    twitter = ""
    email = ""
    weibo = ""
    zhihu = ""
    bilibili = ""
    rss = true
  
  # Sidebar widgets
  [params.widgets]
    announcement = true
    calendar = true
    countdown = true
    recentPosts = true
    recentPostsCount = 5
    categories = true
    categoriesCount = 10
    tags = true
    tagsCount = 20
    statistics = true
    reward = true
    qrcode = true
  
  # Announcement
  [params.announcement]
    title = "📢 重要公告"
    content = "欢迎来到我的博客！"
  
  # Countdown
  [[params.countdown.items]]
    name = "春节"
    date = "2025-01-29"
  
  [[params.countdown.items]]
    name = "新年"
    date = "2025-01-01"
  
  # Reward
  [params.reward]
    enable = true
    title = "请作者喝杯咖啡 ☕"
    wechat = "/images/reward/wechat.png"
    alipay = "/images/reward/alipay.png"
  
  # QRCode
  [params.qrcode]
    enable = false
    title = "关注公众号"
    image = "/images/qrcode.png"
  
  # Comments
  [params.comments]
    enable = true
    type = "disqus"  # disqus, gitalk, valine, waline, twikoo
    
    [params.comments.disqus]
      shortname = ""
    
    [params.comments.gitalk]
      clientID = ""
      clientSecret = ""
      repo = ""
      owner = ""
      admin = [""]
  
  # Search
  [params.search]
    enable = true
    placeholder = "搜索文章..."
  
  # Statistics
  [params.statistics]
    enable = true
    busuanzi = true
  
  # Article settings
  [params.article]
    showToc = true
    showMeta = true
    showShare = true
    showTags = true
    showCategories = true
    showAuthor = true
    showWordCount = true
    showReadingTime = true
    showLastMod = true
    showLicense = true
    license = "CC BY-NC-SA 4.0"
    licenseLink = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  
  # Friends page
  [params.friends]
    enable = true
    description = "友情链接"
  
  # Gallery
  [params.gallery]
    enable = true
    columns = 3
  
  # Movies
  [params.movies]
    enable = true
  
  # Music
  [params.music]
    enable = true
    provider = "netease"  # netease, qq, kugou
  
  # Diary
  [params.diary]
    enable = true

  # Click Effects (鼠标点击效果)
  [params.clickEffect]
    enable = true                    # 是否启用点击效果
    type = "fireworks"              # 效果类型: fireworks(烟花) | text(文字) | heart(爱心) | star(星星) | bubble(气泡) | snow(雪花)
    
    # 烟花效果配置
    [params.clickEffect.fireworks]
      particleCount = 30            # 粒子数量 (10-50)
      spread = 60                  # 扩散角度 (30-120)
      colors = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#ff00ff", "#00ffff"]  # 颜色数组
    
    # 文字效果配置
    [params.clickEffect.text]
      messages = ["富强", "民主", "文明", "和谐", "自由", "平等", "公正", "法治", "爱国", "敬业", "诚信", "友善"]  # 显示的文字列表
      fontSize = "16px"             # 字体大小
      color = "#ff6b6b"            # 文字颜色
      duration = 1000              # 显示时长（毫秒）
    
    # 爱心效果配置
    [params.clickEffect.heart]
      color = "#ff4757"            # 爱心颜色
      size = 20                   # 大小 (10-40)
      count = 5                   # 数量 (1-10)
    
    # 星星效果配置
    [params.clickEffect.star]
      color = "#ffd700"           # 星星颜色
      size = 15                  # 大小 (10-30)
      count = 8                  # 数量 (3-15)
    
    # 气泡效果配置
    [params.clickEffect.bubble]
      colors = ["#74b9ff", "#a29bfe", "#fd79a8", "#ffeaa7"]  # 气泡颜色
      sizeRange = [8, 25]        # 大小范围 [最小, 最大]
      count = 12                 # 数量 (5-20)
    
    # 雪花效果配置
    [params.clickEffect.snow]
      color = "#ffffff"          # 雪花颜色
      sizeRange = [5, 15]        # 大小范围
      count = 20                 # 数量 (10-40)

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# Related content
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
