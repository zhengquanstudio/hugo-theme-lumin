{{/* 微博卡片式链接 */}}
{{ $url := .Get "url" | default "#" }}
{{ $author := .Get "author" | default "" }}
{{ $content := .Get "content" | default (.Get "text" | default "") }}

<a href="{{ $url }}" target="_blank" rel="noopener nofollow"
   class="weibo-card"
   style="display:block;padding:16px;margin:1.2em 0;border-radius:10px;
          background:var(--bg-secondary,#f9fafb);border:1px solid var(--border-light,#e5e7eb);
          text-decoration:none;color:var(--text-primary,#111827);
          transition:all .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.04);">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
    <span style="width:32px;height:32px;background:#ff8200;border-radius:50%;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" fill="#fff" width="18" height="18"><path d="M19.85 11.13c-.45-.54-.38-1.07-.32-1.44.22-1.35.08-2.46-.63-3.36-1.02-1.3-2.82-1.55-4.53-.88-.52.2-.98.49-1.37.84a5.7 5.7 0 00-2.17-.43c-2.96 0-5.47 2.01-6.28 4.77C2.23 11.67.93 13.26.93 15.06c0 2.51 2.03 4.54 4.54 4.54h11.05c2.76 0 5-2.24 5-5 0-1.87-1.04-3.5-2.57-4.34l.9.87z"/></svg>
    </span>
    <span style="font-size:.85rem;font-weight:600;color:var(--text-muted,#6b7280);">
      {{ with $author }}{{ . }}{{ else }}微博用户{{ end }}
      <small style="margin-left:6px;color:#ff8200;">@weibo</small>
    </span>
  </div>
  <div style="font-size:.88rem;line-height:1.65;color:var(--text-primary,#374151);">
    {{ with $content }}{{ . | markdownify }}{{ else }}点击查看完整微博 →{{ end }}
  </div>
</a>

<style>.weibo-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08);border-color:#ff820033;}</style>
