{{ $id := .Get 0 }}
<div class="tencent-video-wrapper" style="position:relative;width:100%;max-width:680px;margin:1.5em auto;padding-bottom:56.25%;overflow:hidden;border-radius:10px;">
  <iframe
    src="https://v.qq.com/txp/iframe/player.html?vid={{ $id }}"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
    scrolling="no"
    frameborder="0"
    allowfullscreen="true">
  </iframe>
</div>
