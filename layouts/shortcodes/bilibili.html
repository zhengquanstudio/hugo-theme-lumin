{{ $id := .Get 0 }}
<div class="bilibili-wrapper" style="position:relative;width:100%;max-width:680px;margin:1.5em auto;padding-bottom:56.25%;overflow:hidden;border-radius:10px;">
  <iframe
    src="//player.bilibili.com/player.html?bvid={{ $id }}&high_quality=1&danmaku=0"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
    scrolling="no"
    frameborder="no"
    allowfullscreen="true"
    loading="lazy">
  </iframe>
</div>
