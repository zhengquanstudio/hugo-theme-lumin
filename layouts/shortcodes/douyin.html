{{/* 抖音视频嵌入 */}}
{{ $id := .Get 0 }}
<div class="douyin-wrapper" style="position:relative;width:100%;max-width:680px;margin:1.5em auto;padding-bottom:177%;overflow:hidden;border-radius:10px;">
  <iframe
    src="https://www.douyin.com/embed/video/{{ $id }}"
    style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"
    scrolling="no"
    frameborder="0"
    allowfullscreen="true"
    loading="lazy">
  </iframe>
</div>
