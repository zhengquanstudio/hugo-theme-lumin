{{/*
  KaTeX 数学公式 + 化学公式渲染
  - 本地文件加载，仅文章页生效
  - 异步加载避免阻塞页面渲染
  - 支持动态重试 (window.renderKaTeXRetry)
*/}}

{{ if and .IsPage (not .IsHome) }}
<script>
(function() {
  'use strict';
  
  var katexLoaded = false;

  function loadKaTeX() {
    if (katexLoaded) return;

    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '/katex/katex.min.css';
    document.head.appendChild(css);

    var s1 = document.createElement('script');
    s1.src = '/katex/katex.min.js';
    s1.onload = function() {
      var s2 = document.createElement('script');
      s2.src = '/katex/mhchem.min.js';
      s2.onload = function() {
        var s3 = document.createElement('script');
        s3.src = '/katex/auto-render.min.js';
        s3.onload = function() {
          katexLoaded = true;
          renderMath();
          // 异步加载完成（含化学公式扩展）
        };
        document.head.appendChild(s3);
      };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  }

  function renderMath() {
    if (typeof renderMathInElement === 'undefined') {
      // renderMathInElement 未定义
      return false;
    }
    try {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
      // 公式渲染完成
      return true;
    } catch(e) {
      console.error('[KaTeX] ✗ 渲染异常:', e);
      return false;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadKaTeX);
  } else {
    loadKaTeX();
  }

  window.renderKaTeXRetry = function() {
    if (!katexLoaded) {
      loadKaTeX();
      setTimeout(renderMath, 500);
    } else {
      renderMath();
    }
  };
})();
</script>
{{ end }}
