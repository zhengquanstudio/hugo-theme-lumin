{{/* Fancybox 6.x 灯箱组件 - 本地化版本（零网络依赖） */}}
{{/* 版本: 6.1.14 | 路径: /libs/fancybox/ */}}

<link rel="stylesheet" href="/libs/fancybox/fancybox.css">

<noscript><link rel="stylesheet" href="/libs/fancybox/fancybox.css"></noscript>

{{/* 异步加载 JS（不阻塞页面渲染） */}}
<script data-cfasync="false">
if (!window.__FANCYBOX_LOADING__) {
  window.__FANCYBOX_LOADING__ = true;
  var s = document.createElement('script');
  s.src = '/libs/fancybox/fancybox.umd.js';
  s.onload = function() {
    window.__FANCYBOX_READY = true;
    // Fancybox 本地加载完成
    document.dispatchEvent(new CustomEvent('fancybox:ready'));
  };
  var first = document.scripts[0];
  first.parentNode.insertBefore(s, first);
}
</script>
