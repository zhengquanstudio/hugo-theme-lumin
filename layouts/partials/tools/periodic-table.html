<style>
.pt-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pt-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--text-muted,#6b7280);padding:4px 10px;background:var(--bg-secondary,#f9fafb);border-radius:8px;border:1px solid var(--border-color,#e5e7eb)}
.pt-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.pt-grid{display:grid;grid-template-columns:repeat(18,52px);gap:2px;justify-content:center;margin-bottom:6px}
.pt-cell{width:50px;height:50px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;border:1.5px solid var(--border-color,#e5e7eb);background:var(--bg-primary,#fff);position:relative;font-size:.62rem;user-select:none}
.pt-cell:hover{transform:scale(1.15);z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.18);border-color:transparent}
.pt-cell-num{font-size:.52rem;color:var(--text-muted,#9ca3af);line-height:1}
.pt-cell-sym{font-size:.88rem;font-weight:800;line-height:1.1;color:var(--text-primary,#1f2937)}
.pt-cell-name{font-size:.5rem;color:var(--text-muted,#9ca3af);line-height:1}
.pt-cell[data-cat="alkali"]{background:#ffe0e0;border-color:#ff6b6b}
.pt-cell[data-cat="alkaline"]{background:#fff8e0;border-color:#ffd93d}
.pt-cell[data-cat="transition"]{background:#fff0e0;border-color:#ff922b}
.pt-cell[data-cat="metal"]{background:#e0ffe0;border-color:#51cf66}
.pt-cell[data-cat="nonmetal"]{background:#e0fff5;border-color:#20c997}
.pt-cell[data-cat="halogen"]{background:#e0efff;border-color:#4dabf7}
.pt-cell[data-cat="noble"]{background:#efe0ff;border-color:#9775fa}
.pt-cell[data-cat="lanthanide"]{background:#ffe0f0;border-color:#f783ac}
.pt-cell[data-cat="actinide"]{background:#f8e0ff;border-color:#da77f2}
.pt-spacer{width:50px;height:50px;background:transparent}
.pt-section-label{grid-column:span 18;text-align:center;font-size:.72rem;font-weight:700;color:var(--text-muted,#9ca3af);padding:8px 0 4px;letter-spacing:1px}
.pt-detail-wrap{margin-top:20px;padding:20px 24px;background:var(--bg-secondary,#f9fafb);border-radius:14px;border:1px solid var(--border-color,#e5e7eb);display:none}
.pt-detail-wrap.show{display:block}
.pt-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.pt-detail-symbol{font-size:2.2rem;font-weight:800;color:#667eea;line-height:1}
.pt-detail-name{font-size:1.3rem;font-weight:700;color:var(--text-primary,#1f2937)}
.pt-detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.pt-detail-stat{padding:10px 14px;background:var(--bg-primary,#fff);border-radius:10px;border:1px solid var(--border-color,#e5e7eb)}
.pt-detail-stat-value{font-size:1rem;font-weight:700;color:#667eea}
.pt-detail-stat-label{font-size:.72rem;color:var(--text-muted,#9ca3af);margin-top:2px}
.pt-grid-wrap{overflow-x:auto;padding-bottom:10px}
[data-theme="dark"] .pt-cell{filter:brightness(.85)}
@media(max-width:1100px){
  .pt-grid{grid-template-columns:repeat(18,38px)}
  .pt-cell{width:37px;height:37px;border-radius:4px}
  .pt-cell-sym{font-size:.7rem}
  .pt-cell-num{font-size:.44rem}
  .pt-cell-name{font-size:.42rem}
  .pt-spacer{width:37px;height:37px}
}
</style>

<div class="pt-legend">
  <div class="pt-legend-item"><span class="pt-legend-dot" style="background:#ff6b6b"></span>碱金属</div>

        var idx=i-3;
        if(idx<actinides.length){
          row+=buildCell(actinides[idx]);
        }else{
          row+=buildSpacer();
        }
      }else{
        row+=buildSpacer();
      }
    }
    html+=row;
    grid.innerHTML=html;
  }

  function showDetail(num){
    var el=elMap[parseInt(num)];
    if(!el) return;
    var detail=document.getElementById("pt-detail");
    document.getElementById("pt-detail-sym").textContent=el.sym;
    document.getElementById("pt-detail-name").textContent=el.name;
    document.getElementById("pt-detail-num").textContent=el.num;
    document.getElementById("pt-detail-cat").textContent=catNames[el.cat]||"未知";
    document.getElementById("pt-detail-mass").textContent=el.mass||"-";
    document.getElementById("pt-detail-state").textContent=el.state||"-";
    detail.classList.add("show");
  }

  function initEvents(){
    document.addEventListener("click",function(e){
      var cell=e.target.closest(".pt-cell");
      if(cell){
        showDetail(cell.getAttribute("data-num"));
      }
    });
  }

  renderMainGrid();
  renderLanthanideGrid();
  renderActinideGrid();
  initEvents();
})();
</script>
