<div class="tool-section">
  <div class="tool-title"><i class="fa-solid fa-eye-dropper"></i> 屏幕取色器</div>
  <button class="tool-btn tool-btn-primary" id="eyedropper-btn" onclick="pickColor()" style="padding:12px 32px;font-size:1rem"><i class="fa-solid fa-eye-dropper"></i> 从屏幕取色</button>
  <div id="eyedropper-not-support" style="color:#f59e0b;font-size:.85rem;margin-top:8px;display:none">当前浏览器不支持 EyeDropper API，请使用 Chrome/Edge 95+</div>
  <div class="eyedropper-result" id="eyedropper-result" style="margin-top:16px">
    <div id="eyedropper-swatch" style="width:120px;height:120px;border-radius:16px;border:2px solid var(--border-color);margin:0 auto 12px;background:var(--bg-card)"></div>
    <div class="color-info-grid">
      <div class="color-info-card"><span>HEX</span><span id="ed-hex">—</span></div>
      <div class="color-info-card"><span>RGB</span><span id="ed-rgb">—</span></div>
      <div class="color-info-card"><span>HSL</span><span id="ed-hsl">—</span></div>
    </div>
    <div style="text-align:center;margin-top:8px">
      <button class="tool-btn" onclick="copyColor()"><i class="fa-solid fa-copy"></i> 复制 HEX</button>
    </div>
  </div>
</div>

<style>
.color-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:500px;margin:0 auto;}
.color-info-card{padding:12px;background:var(--bg-card);border-radius:10px;text-align:center;border:1px solid var(--border-color);}
.color-info-card span{display:block}.color-info-card span:first-child{font-size:.75rem;color:var(--text-secondary)}
.color-info-card span:last-child{font-size:1rem;font-weight:700;}
</style>

<script>
var currentColor='';
window.pickColor=function(){
  if(!window.EyeDropper){document.getElementById('eyedropper-not-support').style.display='block';return;}
  var dropper=new EyeDropper();
  dropper.open().then(function(result){
    currentColor=result.sRGBHex;
    document.getElementById('eyedropper-swatch').style.background=currentColor;
    document.getElementById('ed-hex').textContent=currentColor;
    var r=parseInt(currentColor.slice(1,3),16),g=parseInt(currentColor.slice(3,5),16),b=parseInt(currentColor.slice(5,7),16);
    document.getElementById('ed-rgb').textContent='rgb('+r+', '+g+', '+b+')';
    var rf=r/255,gf=g/255,bf=b/255,max=Math.max(rf,gf,bf),min=Math.min(rf,gf,bf),d=max-min,h=0,l=(max+min)/2,s=d===0?0:d/(1-Math.abs(2*l-1));
    if(d!==0){if(max===rf)h=((gf-bf)/d)%6;else if(max===gf)h=(bf-rf)/d+2;else h=(rf-gf)/d+4;h=Math.round(h*60);}
    s=Math.round(s*100);l=Math.round(l*100);
    document.getElementById('ed-hsl').textContent='hsl('+h+', '+s+'%, '+l+'%)';
  }).catch(function(e){if(e.name!=='AbortError')console.error(e);});
};
window.copyColor=function(){if(!currentColor)return;navigator.clipboard.writeText(currentColor);};
if(!window.EyeDropper)document.getElementById('eyedropper-not-support').style.display='block';
</script>
