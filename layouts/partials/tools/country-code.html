<style>
.cc-search-wrap{margin-bottom:18px}
.cc-table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border-color,#e5e7eb)}
.cc-table{width:100%;border-collapse:collapse;font-size:.88rem}
.cc-table th{background:var(--bg-secondary,#f9fafb);color:var(--text-muted,#6b7280);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;text-align:left;border-bottom:2px solid var(--border-color,#e5e7eb);white-space:nowrap}
.cc-table td{padding:11px 16px;border-bottom:1px solid var(--border-color,#e5e7eb);color:var(--text-primary,#1f2937)}
.cc-table tr:last-child td{border-bottom:none}
.cc-table tr:hover td{background:var(--bg-secondary,#f9fafb)}
[data-theme="dark"] .cc-table th{background:var(--bg-secondary,#0f172a)}
.cc-code{font-weight:700;color:var(--primary-color,#667eea);font-family:monospace;font-size:.92rem}
.cc-flag{font-size:1.1rem}
.cc-empty{padding:40px;text-align:center;color:var(--text-muted,#9ca3af);font-size:.88rem}
.cc-count{font-size:.82rem;color:var(--text-muted,#9ca3af);margin-top:10px}
</style>

</div>

</div>

    if(filter){

    }
    if(filtered.length===0){
      tbody.innerHTML="";
      empty.style.display="";
      countEl.textContent="";
      return;
    }
    empty.style.display="none";
    filtered.forEach(function(c){
      html+="<tr><td>"+c.cn+"</td><td>"+c.en+"</td><td><span class=\"cc-code\">"+c.code+"</span></td><td>"+c.iso+"</td></tr>";
    });
    tbody.innerHTML=html;
