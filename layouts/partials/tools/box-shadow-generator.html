<div style="display:flex;gap:28px;flex-wrap:wrap;">
  <div style="flex:1;min-width:280px;">
    <div class="tool-range-group">
      <label class="tool-label" style="margin-bottom:0;min-width:80px;">水平偏移</label>
      <input class="tool-range" type="range" id="bsg-x" min="-50" max="50" value="0">
      <span class="tool-range-value" id="bsg-x-val">0px</span>
    </div>

    <div class="tool-range-group">
      <label class="tool-label" style="margin-bottom:0;min-width:80px;">垂直偏移</label>
      <input class="tool-range" type="range" id="bsg-y" min="-50" max="50" value="8">
      <span class="tool-range-value" id="bsg-y-val">8px</span>
    </div>

    <div class="tool-range-group">
      <label class="tool-label" style="margin-bottom:0;min-width:80px;">模糊半径</label>
      <input class="tool-range" type="range" id="bsg-blur" min="0" max="100" value="20">
      <span class="tool-range-value" id="bsg-blur-val">20px</span>
    </div>

    <div class="tool-range-group">
      <label class="tool-label" style="margin-bottom:0;min-width:80px;">扩展半径</label>
      <input class="tool-range" type="range" id="bsg-spread" min="-30" max="30" value="0">
      <span class="tool-range-value" id="bsg-spread-val">0px</span>
    </div>

    <div class="tool-input-group">
      <label class="tool-label">阴影颜色</label>
      <div style="display:flex;align-items:center;gap:12px;">
        <input type="color" id="bsg-color" value="#000000" style="width:40px;height:32px;border:none;cursor:pointer;padding:0;">
        <span id="bsg-color-hex" style="font-size:.9rem;font-family:monospace;">#000000</span>
        <input class="tool-input" type="number" id="bsg-opacity" min="0" max="100" value="30" style="width:80px;">
        <span style="font-size:.85rem;color:var(--text-muted);">%</span>
      </div>
    </div>

    <div class="tool-input-group">
      <label class="tool-switch">
        <input type="checkbox" id="bsg-inset">
        <span class="tool-switch-track"></span>
        <span>内阴影 (inset)</span>
      </label>
    </div>
  </div>

  <div style="flex:1;min-width:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div id="bsg-preview" style="width:180px;height:180px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;"></div>
  </div>
</div>

<div class="tool-output">
  <label class="tool-label">CSS 代码</label>
  <div class="tool-result" id="bsg-code">box-shadow: 0px 8px 20px 0px rgba(0,0,0,0.3);</div>
  <button class="tool-copy-btn" id="bsg-copy">复制 CSS</button>
</div>

<script>
(function(){
  var xInput = document.getElementById('bsg-x');
  var yInput = document.getElementById('bsg-y');
  var blurInput = document.getElementById('bsg-blur');
  var spreadInput = document.getElementById('bsg-spread');
  var colorInput = document.getElementById('bsg-color');
  var opacityInput = document.getElementById('bsg-opacity');
  var insetCheck = document.getElementById('bsg-inset');
  var preview = document.getElementById('bsg-preview');
  var codeEl = document.getElementById('bsg-code');
  var copyBtn = document.getElementById('bsg-copy');

  var xVal = document.getElementById('bsg-x-val');
  var yVal = document.getElementById('bsg-y-val');
  var blurVal = document.getElementById('bsg-blur-val');
  var spreadVal = document.getElementById('bsg-spread-val');
  var colorHex = document.getElementById('bsg-color-hex');

  function hexToRgb(hex){
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return r + ', ' + g + ', ' + b;
  }

  function update(){
    var x = parseInt(xInput.value);
    var y = parseInt(yInput.value);
    var blur = parseInt(blurInput.value);
    var spread = parseInt(spreadInput.value);
    var color = colorInput.value;
    var opacity = parseInt(opacityInput.value) / 100;
    var inset = insetCheck.checked ? 'inset ' : '';

    xVal.textContent = x + 'px';
    yVal.textContent = y + 'px';
    blurVal.textContent = blur + 'px';
    spreadVal.textContent = spread + 'px';
    colorHex.textContent = color;

    var rgb = hexToRgb(color);
    var css = inset + x + 'px ' + y + 'px ' + blur + 'px ' + spread + 'px rgba(' + rgb + ', ' + opacity.toFixed(2) + ')';
    preview.style.boxShadow = css;
    codeEl.textContent = 'box-shadow: ' + css + ';';
  }

  [xInput, yInput, blurInput, spreadInput, opacityInput].forEach(function(el){
    el.addEventListener('input', update);
  });
  colorInput.addEventListener('input', update);
  insetCheck.addEventListener('change', update);

  copyBtn.addEventListener('click', function(){
    var text = codeEl.textContent;
    navigator.clipboard.writeText(text).then(function(){
      copyBtn.textContent = '已复制';
      setTimeout(function(){ copyBtn.textContent = '复制 CSS'; }, 1500);
    });
  });

  update();
})();
</script>
