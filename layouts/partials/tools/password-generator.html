<div class="tool-input-group">
  <label class="tool-label">密码长度：<span id="pg-length-value">16</span></label>
  <div class="tool-range-group">
    <input type="range" class="tool-range" id="pg-length" min="8" max="64" value="16">
    <span class="tool-range-value" id="pg-length-display">16</span>
  </div>
</div>

<div class="tool-input-group">
  <label class="tool-label">字符类型</label>
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;">
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="pg-uppercase" checked> 大写字母 (A-Z)
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="pg-lowercase" checked> 小写字母 (a-z)
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="pg-numbers" checked> 数字 (0-9)
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
      <input type="checkbox" id="pg-symbols" checked> 特殊符号 (!@#$...)
    </label>
  </div>
</div>

<div class="tool-input-group">
  <label class="tool-label">批量生成数量</label>
  <div class="tool-range-group">
    <input type="range" class="tool-range" id="pg-count" min="1" max="20" value="1">
    <span class="tool-range-value" id="pg-count-display">1</span>
  </div>
</div>

<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="pg-generate-btn">生成密码</button>
  <button class="tool-btn" id="pg-clear-btn">清空</button>
</div>

<div id="pg-error" style="display:none;color:var(--color-error,#e53e3e);margin-top:8px;"></div>

<div class="tool-output" id="pg-output-area" style="display:none;">
  <div id="pg-results"></div>
</div>

<div id="pg-history-area" style="display:none;margin-top:16px;">
  <label class="tool-label">历史记录（最近 5 条）</label>
  <div id="pg-history"></div>
</div>

<script>
(function(){
  const lengthSlider = document.getElementById('pg-length');
  const lengthValue = document.getElementById('pg-length-value');
  const lengthDisplay = document.getElementById('pg-length-display');
  const countSlider = document.getElementById('pg-count');
  const countDisplay = document.getElementById('pg-count-display');
  const outputArea = document.getElementById('pg-output-area');
  const resultsDiv = document.getElementById('pg-results');
  const errorDiv = document.getElementById('pg-error');
  const historyArea = document.getElementById('pg-history-area');
  const historyDiv = document.getElementById('pg-history');

  const history = [];

  const CHARS = {
    uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lowercase: 'abcdefghijklmnopqrstuvwxyz',
    numbers: '0123456789',
    symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?/~`'
  };

  lengthSlider.addEventListener('input', () => {
    lengthValue.textContent = lengthSlider.value;
    lengthDisplay.textContent = lengthSlider.value;
  });

  countSlider.addEventListener('input', () => {
    countDisplay.textContent = countSlider.value;
  });

  function showError(msg) {
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
    outputArea.style.display = 'none';
  }

  function hideError() {
    errorDiv.style.display = 'none';
  }

  function getStrength(password) {
    let score = 0;
    if (password.length >= 8) score++;
    if (password.length >= 12) score++;
    if (password.length >= 16) score++;
    if (password.length >= 24) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^a-zA-Z0-9]/.test(password)) score++;
    if (new Set(password).size >= password.length * 0.6) score++;

    if (score <= 3) return { label: '弱', color: '#e53e3e' };
    if (score <= 5) return { label: '中等', color: '#dd6b20' };
    if (score <= 7) return { label: '强', color: '#38a169' };
    return { label: '非常强', color: '#3182ce' };
  }

  function generatePassword(length, charsets) {
    const pool = charsets.join('');
    const required = charsets.map(cs => cs[Math.floor(Math.random() * cs.length)]);
    const remaining = length - required.length;
    const result = [...required];
    for (let i = 0; i < remaining; i++) {
      result.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    // Shuffle
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result.join('');
  }

  function createPasswordItem(password, index) {
    const item = document.createElement('div');
    item.style.cssText = 'margin-bottom:12px;';

    const strength = getStrength(password);

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;';

    const labelEl = document.createElement('span');
    labelEl.style.cssText = 'font-size:0.9em;font-weight:600;';
    labelEl.textContent = index > 0 ? `密码 ${index}` : '密码';

    const strengthEl = document.createElement('span');
    strengthEl.style.cssText = `font-size:0.8em;padding:2px 8px;border-radius:4px;color:#fff;background:${strength.color};`;
    strengthEl.textContent = strength.label;

    header.appendChild(labelEl);
    header.appendChild(strengthEl);

    const valueRow = document.createElement('div');
    valueRow.style.cssText = 'display:flex;align-items:center;gap:8px;';

    const valueEl = document.createElement('div');
    valueEl.className = 'tool-result';
    valueEl.style.cssText = 'flex:1;word-break:break-all;font-family:monospace;font-size:0.9em;letter-spacing:0.5px;';
    valueEl.textContent = password;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'tool-copy-btn';
    copyBtn.textContent = '复制';
    copyBtn.style.cssText = 'flex-shrink:0;';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(password).then(() => {
        copyBtn.textContent = '已复制！';
        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = password;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = '已复制！';
        setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
      });
    });

    valueRow.appendChild(valueEl);
    valueRow.appendChild(copyBtn);

    item.appendChild(header);
    item.appendChild(valueRow);
    return item;
  }

  function renderHistory() {
    if (history.length === 0) {
      historyArea.style.display = 'none';
      return;
    }
    historyArea.style.display = 'block';
    historyDiv.innerHTML = '';
    history.forEach((pw, i) => {
      const item = document.createElement('div');
      item.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;';

      const num = document.createElement('span');
      num.style.cssText = 'font-size:0.8em;color:var(--color-text-muted,#999);min-width:20px;';
      num.textContent = `${i + 1}.`;

      const pwEl = document.createElement('span');
      pwEl.style.cssText = 'flex:1;font-family:monospace;font-size:0.85em;word-break:break-all;';
      pwEl.textContent = pw;

      const copyBtn = document.createElement('button');
      copyBtn.className = 'tool-copy-btn';
      copyBtn.textContent = '复制';
      copyBtn.style.cssText = 'font-size:0.75em;flex-shrink:0;';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(pw).then(() => {
          copyBtn.textContent = '已复制！';
          setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
        }).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = pw;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyBtn.textContent = '已复制！';
          setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
        });
      });

      item.appendChild(num);
      item.appendChild(pwEl);
      item.appendChild(copyBtn);
      historyDiv.appendChild(item);
    });
  }

  document.getElementById('pg-generate-btn').addEventListener('click', () => {
    hideError();

    const wantUpper = document.getElementById('pg-uppercase').checked;
    const wantLower = document.getElementById('pg-lowercase').checked;
    const wantNumbers = document.getElementById('pg-numbers').checked;
    const wantSymbols = document.getElementById('pg-symbols').checked;

    if (!wantUpper && !wantLower && !wantNumbers && !wantSymbols) {
      showError('请至少选择一种字符类型');
      return;
    }

    const length = parseInt(lengthSlider.value, 10);
    const count = parseInt(countSlider.value, 10);

    const charsets = [];
    if (wantUpper) charsets.push(CHARS.uppercase);
    if (wantLower) charsets.push(CHARS.lowercase);
    if (wantNumbers) charsets.push(CHARS.numbers);
    if (wantSymbols) charsets.push(CHARS.symbols);

    resultsDiv.innerHTML = '';

    for (let i = 0; i < count; i++) {
      const pw = generatePassword(length, charsets);
      resultsDiv.appendChild(createPasswordItem(pw, count > 1 ? i + 1 : 0));

      // Add to history (only first password for batch)
      if (i === 0) {
        history.unshift(pw);
        if (history.length > 5) history.pop();
      }
    }

    outputArea.style.display = 'block';
    renderHistory();
  });

  document.getElementById('pg-clear-btn').addEventListener('click', () => {
    resultsDiv.innerHTML = '';
    outputArea.style.display = 'none';
    hideError();
  });
})();
</script>
