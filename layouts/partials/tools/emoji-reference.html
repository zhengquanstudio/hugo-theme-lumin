  // Convert Twemoji code string back to real emoji character (for clipboard)
  function twemojiToEmoji(code) {
    var cps = code.split('-');
    var chars = [];
    for (var i = 0; i < cps.length; i++) {
      var cp = parseInt(cps[i], 16);
      if (cp > 0xFFFF) {
        var hi = Math.floor((cp - 0x10000) / 0x400) + 0xD800;
        var lo = (cp - 0x10000) % 0x400 + 0xDC00;
        chars.push(String.fromCharCode(hi, lo));
      } else {
        chars.push(String.fromCharCode(cp));
      }
    }
    return chars.join('');
  }

  // Split emoji strings into arrays, handling multi-codepoint sequences
  function splitEmoji(str) {

    var len = str.length;
    while (i < len) {
      var cp = str.codePointAt(i);
      if (cp >= 0x1F1E6 && cp <= 0x1F1FF) {
        if (i + 2 < len) {
          var nextCp = str.codePointAt(i + 2);
          if (nextCp >= 0x1F1E6 && nextCp <= 0x1F1FF) {
            result.push(str.substring(i, i + 4));
            i += 4;
            continue;
          }
        }
        result.push(str.substring(i, i + 2));
        i += 2;
        continue;
      }
      var start = i;
      i += (cp > 0xFFFF) ? 2 : 1;
      while (i < len) {
        if (str.codePointAt(i) === 0x200D) {
          i += 1;
          if (i < len) {
            var nextCp2 = str.codePointAt(i);
            i += (nextCp2 > 0xFFFF) ? 2 : 1;
            if (i < len && str.codePointAt(i) === 0xFE0F) i += 1;
          }
        } else if (str.codePointAt(i) === 0xFE0F) {
          i += 1;
        } else {
          break;
        }
      }
      result.push(str.substring(start, i));
    }
    return result;

        list = processed[cat] || [];
      }
      html = '<div class="tool-output"><div class="tool-output-title">' + (search ? '搜索 "' + search + '"（' + list.length + ' 个结果）' : cat + '（' + list.length + ' 个 Emoji，点击复制）') + '</div>';
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;">';
      for (var i = 0; i < list.length; i++) {
        html += '<button class="emoji-cell" data-emoji="' + list[i].replace(/"/g, '&quot;') + '" style="width:48px;height:48px;border:1px solid var(--border-color,#e5e7eb);background:var(--bg-primary,#fff);border-radius:8px;cursor:pointer;font-size:24px;text-align:center;line-height:48px;padding:0;transition:transform 0.15s;display:flex;align-items:center;justify-content:center;" title="点击复制">' + list[i] + '</button>';
      }
      html += '</div></div>';
    }

    document.getElementById('emoji-result').innerHTML = html;

    var tabBtns = document.querySelectorAll('#emoji-tabs .tool-tab');
    for (var t = 0; t < tabBtns.length; t++) {
      tabBtns[t].addEventListener('click', function() {
        activeCat = this.dataset.cat;
        document.getElementById('emoji-search').value = '';
        render(this.dataset.cat, '');
      });
    }

    var cells = document.querySelectorAll('.emoji-cell');
    for (var c = 0; c < cells.length; c++) {
      cells[c].addEventListener('click', function() {
        // Prefer data-emoji attribute (accurate for flags), fallback to text content
        var emojiChar = this.dataset.emoji || '';
        if (!emojiChar) {
          for (var n = 0; n < this.childNodes.length; n++) {
            if (this.childNodes[n].nodeType === 3) {
              emojiChar = this.childNodes[n].textContent;
              break;
            }
          }
        }
        if (!emojiChar) emojiChar = this.textContent.trim();
        navigator.clipboard.writeText(emojiChar.trim()).then(function() {
          var toast = document.createElement('div');
          toast.textContent = '已复制!';
          toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--success-color,#4caf50);color:#fff;padding:8px 20px;border-radius:6px;font-size:14px;z-index:9999;transition:opacity 0.3s;';
          document.body.appendChild(toast);
          setTimeout(function() {
            toast.style.opacity = '0';
            setTimeout(function() { toast.remove(); }, 300);
          }, 1800);
          var orig = this.style.background;
          this.style.background = 'var(--success-bg,rgba(34,197,94,.1))';
          var self = this;
          setTimeout(function() { self.style.background = orig; }, 600);
        }.bind(this));
      });
    }
  }

  render('笑脸', '');

  document.getElementById('emoji-search').addEventListener('input', function() {
    render(activeCat, this.value);
  });
})();
</script>

  z-index: 2;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.tool-tab:hover {
  background: var(--bg-secondary,#f0f4ff) !important;
}
