<div class="tool-input-group">
  <label class="tool-label">目标日期时间</label>
  <input type="datetime-local" class="tool-input" id="cd-target" style="max-width:320px;">
</div>

<div class="tool-input-group">
  <label class="tool-label">倒计时标题（可选）</label>
  <input type="text" class="tool-input" id="cd-title" placeholder="例如：新年 2027、项目截止..." style="max-width:320px;">
</div>

<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="cd-start-btn"><i class="fas fa-play"></i> 开始倒计时</button>
  <button class="tool-btn tool-btn-danger" id="cd-reset-btn" style="display:none;"><i class="fas fa-stop"></i> 停止</button>
</div>

<div id="cd-display" style="display:none;text-align:center;padding:28px;background:var(--bg-secondary,#f9fafb);border-radius:16px;border:1.5px solid var(--border-color,#e5e7eb);margin-top:18px;">
  <div id="cd-title-display" style="font-size:1rem;font-weight:600;color:var(--text-muted,#6b7280);margin-bottom:12px;"></div>
  <div id="cd-finished-msg" style="display:none;font-size:1.5rem;font-weight:800;color:#22c55e;">🎉 时间到了！</div>
  <div id="cd-countdown-grid" style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;">
    <div class="cd-unit" id="cd-days-block">
      <div id="cd-days" class="cd-num">00</div>
      <div class="cd-lbl">天</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div id="cd-hours" class="cd-num">00</div>
      <div class="cd-lbl">时</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div id="cd-minutes" class="cd-num">00</div>
      <div class="cd-lbl">分</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div id="cd-seconds" class="cd-num">00</div>
      <div class="cd-lbl">秒</div>
    </div>
  </div>
  <div id="cd-target-date-display" style="margin-top:14px;font-size:.82rem;color:var(--text-muted,#9ca3af);"></div>
</div>

<style>
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:4px;}
.cd-num{font-size:2.5rem;font-weight:800;color:#667eea;font-family:'Cascadia Code',Consolas,monospace;min-width:2.5ch;text-align:center;line-height:1;}
.cd-lbl{font-size:.75rem;color:var(--text-muted,#9ca3af);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.cd-sep{font-size:2rem;font-weight:800;color:#667eea;line-height:1;align-self:center;margin-top:-12px;}
@media(max-width:480px){.cd-num{font-size:1.8rem;}.cd-sep{font-size:1.4rem;}}
</style>

<script>
(function(){
  let timer = null;
  const targetInput = document.getElementById('cd-target');
  const titleInput = document.getElementById('cd-title');
  const display = document.getElementById('cd-display');
  const finishedMsg = document.getElementById('cd-finished-msg');
  const countdownGrid = document.getElementById('cd-countdown-grid');
  const startBtn = document.getElementById('cd-start-btn');
  const resetBtn = document.getElementById('cd-reset-btn');

  // Set default to next year's start
  const now = new Date();
  const nextYear = new Date(now.getFullYear()+1, 0, 1, 0, 0, 0);
  const offset = now.getTimezoneOffset() * 60000;
  targetInput.value = new Date(nextYear.getTime() - offset).toISOString().slice(0,16);

  function pad(n){ return String(n).padStart(2,'0'); }

  function update() {
    const target = new Date(targetInput.value);
    const diff = target.getTime() - Date.now();
    if(diff <= 0) {
      document.getElementById('cd-days').textContent = '00';
      document.getElementById('cd-hours').textContent = '00';
      document.getElementById('cd-minutes').textContent = '00';
      document.getElementById('cd-seconds').textContent = '00';
      finishedMsg.style.display = '';
      countdownGrid.style.display = 'none';
      clearInterval(timer); timer = null;
      return;
    }
    const totalSec = Math.floor(diff/1000);
    const days = Math.floor(totalSec/86400);
    const hours = Math.floor((totalSec%86400)/3600);
    const minutes = Math.floor((totalSec%3600)/60);
    const seconds = totalSec%60;
    document.getElementById('cd-days').textContent = pad(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-minutes').textContent = pad(minutes);
    document.getElementById('cd-seconds').textContent = pad(seconds);
    finishedMsg.style.display = 'none';
    countdownGrid.style.display = '';
  }

  startBtn.addEventListener('click', () => {
    if(!targetInput.value){alert('请选择目标日期时间');return;}
    const target = new Date(targetInput.value);
    if(target <= new Date()){alert('目标时间必须晚于当前时间');return;}
    if(timer) clearInterval(timer);
    document.getElementById('cd-title-display').textContent = titleInput.value || '倒计时';
    document.getElementById('cd-target-date-display').textContent = '目标：' + target.toLocaleString('zh-CN');
    display.style.display = '';
    resetBtn.style.display = '';
    update();
    timer = setInterval(update, 1000);
  });

  resetBtn.addEventListener('click', () => {
    if(timer){clearInterval(timer); timer=null;}
    display.style.display = 'none';
    resetBtn.style.display = 'none';
  });
})();
</script>
