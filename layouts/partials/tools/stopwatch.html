<div style="text-align:center;">
  <div id="sw-display" style="font-size:48px;font-family:monospace;margin:16px 0;font-weight:bold;">00:00.00</div>
</div>
<div class="tool-btn-row" style="justify-content:center;">
  <button class="tool-btn tool-btn-primary" id="sw-start">开始</button>
  <button class="tool-btn" id="sw-pause" disabled>暂停</button>
  <button class="tool-btn" id="sw-lap" disabled>计次</button>
  <button class="tool-btn" id="sw-reset">重置</button>
</div>
<div id="sw-laps" style="margin-top:12px;max-height:250px;overflow:auto;">
  <table style="width:100%;border-collapse:collapse;font-size:13px;">
    <thead><tr style="background:#f5f5f5;"><th style="padding:6px;text-align:left;">序号</th><th style="padding:6px;text-align:left;">分段时间</th><th style="padding:6px;text-align:left;">累计时间</th></tr></thead>
    <tbody id="sw-laps-body"></tbody>
  </table>
</div>

<script>
(function() {
  var startTime = 0, elapsed = 0, timer = null, running = false;
  var display = document.getElementById('sw-display');
  var startBtn = document.getElementById('sw-start');
  var pauseBtn = document.getElementById('sw-pause');
  var lapBtn = document.getElementById('sw-lap');
  var resetBtn = document.getElementById('sw-reset');
  var lapsBody = document.getElementById('sw-laps-body');
  var lapCount = 0, lastLapTime = 0;

  function format(ms) {
    var totalSec = ms / 1000;
    var min = Math.floor(totalSec / 60);
    var sec = Math.floor(totalSec % 60);
    var cent = Math.floor((ms % 1000) / 10);
    return String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0') + '.' + String(cent).padStart(2,'0');
  }

  function tick() {
    var now = Date.now();
    var total = elapsed + (running ? now - startTime : 0);
    display.textContent = format(total);
  }

  startBtn.addEventListener('click', function() {
    if (running) return;
    running = true;
    startTime = Date.now();
    timer = setInterval(tick, 10);
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    lapBtn.disabled = false;
  });

  pauseBtn.addEventListener('click', function() {
    if (!running) return;
    running = false;
    elapsed += Date.now() - startTime;
    clearInterval(timer);
    startBtn.disabled = false;
    startBtn.textContent = '继续';
    pauseBtn.disabled = true;
    lapBtn.disabled = true;
  });

  lapBtn.addEventListener('click', function() {
    lapCount++;
    var total = elapsed + (Date.now() - startTime);
    var lapTime = total - lastLapTime;
    lastLapTime = total;
    var row = lapsBody.insertRow(0);
    row.style.borderBottom = '1px solid #eee';
    row.innerHTML = '<td style="padding:6px;">' + lapCount + '</td><td style="padding:6px;font-family:monospace;">' + format(lapTime) + '</td><td style="padding:6px;font-family:monospace;">' + format(total) + '</td>';
  });

  resetBtn.addEventListener('click', function() {
    running = false;
    clearInterval(timer);
    elapsed = 0;
    lastLapTime = 0;
    lapCount = 0;
    display.textContent = '00:00.00';
    startBtn.disabled = false;
    startBtn.textContent = '开始';
    pauseBtn.disabled = true;
    lapBtn.disabled = true;
    lapsBody.innerHTML = '';
  });

  tick();
})();
</script>
