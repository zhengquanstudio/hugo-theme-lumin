<div class="tool-input-group">
  <label class="tool-label">输入文本</label>
  <textarea class="tool-textarea" id="aln-input" placeholder="在此输入文本，每行将添加行号..." style="min-height:180px;">苹果
香蕉
橙子
草莓
西瓜
葡萄</textarea>
</div>

<div style="display:flex;flex-wrap:wrap;gap:20px;margin-bottom:18px;align-items:flex-end;">
  <div class="tool-input-group" style="margin:0;flex:1;min-width:160px;">
    <label class="tool-label">起始序号</label>
    <input type="number" class="tool-input" id="aln-start" value="1" min="0">
  </div>
  <div class="tool-input-group" style="margin:0;flex:1;min-width:160px;">
    <label class="tool-label">分隔符</label>
    <input type="text" class="tool-input" id="aln-sep" value=". " placeholder="如 '. ' 或 ') ' 或 ': '">
  </div>
  <div class="tool-input-group" style="margin:0;flex:1;min-width:160px;">
    <label class="tool-label">前缀</label>
    <input type="text" class="tool-input" id="aln-prefix" placeholder="如 'Line '（可选）">
  </div>
</div>

<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;">
  <label class="tool-switch"><input type="checkbox" id="aln-pad"><span class="tool-switch-track"></span>数字补零对齐</label>
  <label class="tool-switch"><input type="checkbox" id="aln-skip-empty"><span class="tool-switch-track"></span>跳过空行不编号</label>
</div>

<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="aln-process-btn"><i class="fas fa-list-ol"></i> 添加行号</button>
  <button class="tool-btn" id="aln-clear-btn"><i class="fas fa-trash"></i> 清空</button>
</div>

<div class="tool-output" id="aln-output" style="display:none;">
  <div class="tool-output-label">
    <span class="tool-output-title">处理结果</span>
    <button class="tool-copy-btn" id="aln-copy-btn"><i class="far fa-copy"></i> 复制</button>
  </div>
  <textarea class="tool-result" id="aln-result" readonly style="min-height:180px;"></textarea>
</div>

<script>
(function(){
  const input = document.getElementById('aln-input');
  const resultArea = document.getElementById('aln-result');
  const output = document.getElementById('aln-output');
  const copyBtn = document.getElementById('aln-copy-btn');

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.innerHTML; btn.innerHTML = '✅ 已复制'; btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      const orig = btn.innerHTML; btn.innerHTML = '✅ 已复制'; btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1500);
    });
  }

  document.getElementById('aln-process-btn').addEventListener('click', () => {
    const text = input.value;
    if (!text) return;
    const start = parseInt(document.getElementById('aln-start').value) || 1;
    const sep = document.getElementById('aln-sep').value;
    const prefix = document.getElementById('aln-prefix').value;
    const pad = document.getElementById('aln-pad').checked;
    const skipEmpty = document.getElementById('aln-skip-empty').checked;

    const lines = text.split('\n');
    const maxNum = start + lines.filter(l => !(skipEmpty && l.trim() === '')).length - 1;
    const padLen = String(maxNum).length;

    let num = start;
    const result = lines.map(line => {
      if (skipEmpty && line.trim() === '') return line;
      const numStr = pad ? String(num).padStart(padLen, '0') : String(num);
      num++;
      return prefix + numStr + sep + line;
    }).join('\n');

    resultArea.value = result;
    output.style.display = '';
  });

  copyBtn.addEventListener('click', () => copyText(resultArea.value, copyBtn));

  document.getElementById('aln-clear-btn').addEventListener('click', () => {
    input.value = ''; resultArea.value = ''; output.style.display = 'none';
  });
})();
</script>
