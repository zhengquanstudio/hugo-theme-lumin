<div class="tool-input-group">
  <label class="tool-label">上传图片</label>
  <input type="file" id="ifc-file" accept="image/*" style="display:block;margin-top:4px;">
</div>
<div class="tool-input-group">
  <label class="tool-label">目标格式</label>
  <select class="tool-select" id="ifc-format">
    <option value="image/png">PNG</option>
    <option value="image/jpeg">JPEG</option>
    <option value="image/webp">WebP</option>
  </select>
</div>
<div class="tool-input-group" id="ifc-quality-group" style="display:none;">
  <label class="tool-label">质量</label>
  <div style="display:flex;align-items:center;gap:10px;">
    <input type="range" class="tool-range" id="ifc-quality" min="0.1" max="1.0" step="0.1" value="0.8" style="flex:1;">
    <span id="ifc-quality-val">0.8</span>
  </div>
</div>
<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="ifc-convert" disabled>转换格式</button>
</div>
<div id="ifc-preview" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;"></div>

<script>
(function() {
  var sourceImg = null;

  document.getElementById('ifc-quality').addEventListener('input', function() {
    document.getElementById('ifc-quality-val').textContent = this.value;
  });

  document.getElementById('ifc-format').addEventListener('change', function() {
    var fmt = this.value;
    document.getElementById('ifc-quality-group').style.display = (fmt === 'image/png') ? 'none' : '';
  });

  document.getElementById('ifc-file').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt) {
      var img = new Image();
      img.onload = function() {
        sourceImg = img;
        document.getElementById('ifc-convert').disabled = false;
        document.getElementById('ifc-preview').innerHTML = '<div style="flex:1;min-width:150px;"><div class="tool-label">原图</div><img src="' + evt.target.result + '" style="max-width:100%;max-height:250px;border:1px solid #ddd;border-radius:4px;"></div>';
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('ifc-convert').addEventListener('click', function() {
    if (!sourceImg) return;
    var format = document.getElementById('ifc-format').value;
    var quality = parseFloat(document.getElementById('ifc-quality').value);

    var canvas = document.createElement('canvas');
    canvas.width = sourceImg.width;
    canvas.height = sourceImg.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(sourceImg, 0, 0);

    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var ext = format === 'image/png' ? 'png' : (format === 'image/webp' ? 'webp' : 'jpg');
      document.getElementById('ifc-preview').innerHTML += '<div style="flex:1;min-width:150px;"><div class="tool-label">转换后 (' + ext.toUpperCase() + ')</div><img src="' + url + '" style="max-width:100%;max-height:250px;border:1px solid #ddd;border-radius:4px;"></div>' +
        '<p style="width:100%;margin-top:8px;"><button class="tool-btn tool-btn-success" onclick="var a=document.createElement(\'a\');a.href=\'' + url + '\';a.download=\'converted.' + ext + '\';a.click();">下载图片</button></p>';
    }, format, quality);
  });
})();
</script>
