<div class="tool-tabs" id="cc-tabs">
  <button class="tool-tab active" data-tab="cc-s2t">简体 → 繁体</button>
  <button class="tool-tab" data-tab="cc-t2s">繁体 → 简体</button>
</div>

<div class="tool-input-group">
  <label class="tool-label">输入文本</label>
  <textarea class="tool-textarea" id="cc-input" rows="8" placeholder="请输入需要转换的中文文本">欢迎使用简繁转换工具。这里可以将简体中文转换为繁体中文，或将繁体中文转换为简体中文。</textarea>
</div>

<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="cc-convert-btn">转换</button>
  <button class="tool-btn" id="cc-clear-btn">清空</button>
</div>

<div id="cc-error" style="display:none;color:var(--color-error,#e53e3e);margin-top:8px;"></div>

<div class="tool-output" id="cc-output-area" style="display:none;">
  <div class="tool-result" id="cc-result"></div>
  <button class="tool-copy-btn" id="cc-copy-btn">复制结果</button>
</div>

<div class="tool-stats" id="cc-stats" style="display:none;">
  <div class="tool-stat">
    <span class="tool-stat-value" id="cc-stat-chars">0</span>
    <span class="tool-stat-label">字符数</span>
  </div>
  <div class="tool-stat">
    <span class="tool-stat-value" id="cc-stat-converted">0</span>
    <span class="tool-stat-label">已转换</span>
  </div>
</div>

  const T2S = {};
  let uniqueCount = 0;
  for (const [s, t] of Object.entries(S2T)) {
    T2S[t] = s;
  }
  uniqueCount = Object.keys(S2T).length;

  function convertS2T(text) {
    let result = '';
    let converted = 0;
    for (const ch of text) {
      if (S2T[ch] !== undefined) {
        result += S2T[ch];
        if (S2T[ch] !== ch) converted++;
      } else {
        result += ch;
      }
    }
    return { result, converted };
  }

  function convertT2S(text) {
    let result = '';
    let converted = 0;
    for (const ch of text) {
      if (T2S[ch] !== undefined) {
        result += T2S[ch];
        if (T2S[ch] !== ch) converted++;
      } else {
        result += ch;
      }
    }
    return { result, converted };
  }

    const raw = input.value;
    if (!raw.trim()) { showError('请输入文本'); return; }

    let output = '';
    let converted = 0;

    if (currentTab === 'cc-s2t') {
      const res = convertS2T(raw);
      output = res.result;
      converted = res.converted;
    } else {
      const res = convertT2S(raw);
      output = res.result;
      converted = res.converted;
    }

    result.textContent = output;
    document.getElementById('cc-stat-chars').textContent = raw.length;
    document.getElementById('cc-stat-converted').textContent = converted;
    outputArea.style.display = 'block';
    statsDiv.style.display = 'flex';
  });

  });

    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('cc-copy-btn');
      btn.textContent = '已复制！';
      setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.getElementById('cc-copy-btn');
      btn.textContent = '已复制！';
      setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
