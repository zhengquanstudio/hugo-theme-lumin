<div class="tool-tabs">
  <button class="tool-tab active" data-pn-tab="check">判断质数</button>
  <button class="tool-tab" data-pn-tab="list">生成质数列表</button>
</div>

<div id="pn-panel-check">
  <div class="tool-input-group">
    <label class="tool-label">输入整数</label>
    <input type="number" class="tool-input" id="pn-check-input" placeholder="输入正整数，如 17" min="1" style="max-width:300px;">
  </div>
  <div class="tool-btn-row">
    <button class="tool-btn tool-btn-primary" id="pn-check-btn"><i class="fas fa-magnifying-glass"></i> 判断</button>
  </div>
  <div id="pn-check-result" style="display:none;margin-top:14px;"></div>
</div>

<div id="pn-panel-list" style="display:none;">
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px;">
    <div class="tool-input-group" style="margin:0;flex:1;min-width:130px;">
      <label class="tool-label">起始</label>
      <input type="number" class="tool-input" id="pn-from" value="1" min="1">
    </div>
    <div class="tool-input-group" style="margin:0;flex:1;min-width:130px;">
      <label class="tool-label">结束（≤10000）</label>
      <input type="number" class="tool-input" id="pn-to" value="100" min="2" max="10000">
    </div>
  </div>
  <div class="tool-btn-row">
    <button class="tool-btn tool-btn-primary" id="pn-list-btn"><i class="fas fa-list"></i> 生成列表</button>
  </div>
  <div class="tool-output" id="pn-list-output" style="display:none;">
    <div class="tool-output-label">
      <span class="tool-output-title">质数列表 <span id="pn-list-count" style="font-weight:400;color:var(--text-muted,#9ca3af);font-size:.8rem;"></span></span>
      <button class="tool-copy-btn" id="pn-list-copy"><i class="far fa-copy"></i> 复制</button>
    </div>
    <textarea class="tool-result" id="pn-list-result" readonly style="min-height:120px;"></textarea>
  </div>
</div>

<script>
(function(){
  const tabs = document.querySelectorAll('[data-pn-tab]');
  const panelCheck = document.getElementById('pn-panel-check');
  const panelList = document.getElementById('pn-panel-list');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t=>t.classList.remove('active')); tab.classList.add('active');
      const t = tab.getAttribute('data-pn-tab');
      panelCheck.style.display = t==='check'?'':'none';
      panelList.style.display = t==='list'?'':'none';
    });
  });

  function isPrime(n) {
    if(n<2) return false;
    if(n===2) return true;
    if(n%2===0) return false;
    for(let i=3;i<=Math.sqrt(n);i+=2) if(n%i===0) return false;
    return true;
  }

  function getFactors(n) {
    const factors=[];
    for(let i=2;i<=n;i++) while(n%i===0){factors.push(i);n/=i;}
    return factors;
  }

  document.getElementById('pn-check-btn').addEventListener('click', ()=>{
    const n = parseInt(document.getElementById('pn-check-input').value);
    if(isNaN(n)||n<1){alert('请输入正整数');return;}
    const prime = isPrime(n);
    const res = document.getElementById('pn-check-result');
    if(prime) {
      res.innerHTML = `<div style="padding:18px;border-radius:12px;background:rgba(34,197,94,.08);border:1.5px solid rgba(34,197,94,.3);text-align:center;">
        <div style="font-size:1.6rem;">✅</div>
        <div style="font-size:1.15rem;font-weight:800;color:#22c55e;margin:4px 0;">${n} 是质数</div>
        <div style="font-size:.85rem;color:var(--text-muted,#6b7280);">该数只能被 1 和它本身整除</div>
      </div>`;
    } else {
      const factors = getFactors(n);
      const factorStr = factors.length ? factors.join(' × ') : '—';
      res.innerHTML = `<div style="padding:18px;border-radius:12px;background:rgba(239,68,68,.06);border:1.5px solid rgba(239,68,68,.25);text-align:center;">
        <div style="font-size:1.6rem;">❌</div>
        <div style="font-size:1.15rem;font-weight:800;color:#ef4444;margin:4px 0;">${n} 不是质数</div>
        <div style="font-size:.85rem;color:var(--text-muted,#6b7280);">质因数分解：${n} = ${factorStr}</div>
      </div>`;
    }
    res.style.display='';
  });

  function sieve(from, to) {
    const arr = new Array(to+1).fill(true);
    arr[0]=arr[1]=false;
    for(let i=2;i*i<=to;i++) if(arr[i]) for(let j=i*i;j<=to;j+=i) arr[j]=false;
    const primes=[];
    for(let i=Math.max(2,from);i<=to;i++) if(arr[i]) primes.push(i);
    return primes;
  }

  document.getElementById('pn-list-btn').addEventListener('click', ()=>{
    const from=parseInt(document.getElementById('pn-from').value)||1;
    const to=parseInt(document.getElementById('pn-to').value)||100;
    if(to>10000){alert('范围请不超过 10000');return;}
    if(from>to){alert('起始值不能大于结束值');return;}
    const primes=sieve(from,to);
    document.getElementById('pn-list-result').value=primes.join(', ');
    document.getElementById('pn-list-count').textContent=`共 ${primes.length} 个`;
    document.getElementById('pn-list-output').style.display='';
  });

  document.getElementById('pn-list-copy').addEventListener('click', ()=>{
    const text=document.getElementById('pn-list-result').value;
    navigator.clipboard.writeText(text).then(()=>{
      const btn=document.getElementById('pn-list-copy');
      const orig=btn.innerHTML; btn.innerHTML='✅ 已复制'; btn.classList.add('copied');
      setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove('copied');},1500);
    }).catch(()=>{});
  });
})();
</script>
