<div class="tool-input-group">

</div>

<div class="tool-input-group">
  <label class="tool-label">拼音格式</label>
  <select class="tool-select" id="py-mode">
    <option value="tone" selected>带声调 (nǐ hǎo)</option>
    <option value="notone">不带声调 (ni hao)</option>
    <option value="first">首字母 (nh)</option>
  </select>
</div>

<div class="tool-btn-row">
  <button class="tool-btn tool-btn-primary" id="py-convert-btn">转换</button>
  <button class="tool-btn" id="py-clear-btn">清空</button>
</div>

<div id="py-error" style="display:none;color:var(--color-error,#e53e3e);margin-top:8px;"></div>

<div class="tool-output" id="py-output-area" style="display:none;">

  <button class="tool-copy-btn" id="py-copy-btn">复制结果</button>
</div>

  function stripTone(pinyin) {
    return pinyin.replace(/\d/g, '');
  }

  function getFirstLetter(pinyin) {
    return pinyin.charAt(0);
  }

  function convertText(text, mode) {
    let result = [];
    for (const ch of text) {
      if (/[\u4e00-\u9fff]/.test(ch)) {
        // 中文
        if (PINYIN_MAP[ch]) {
          const raw = PINYIN_MAP[ch];
          if (mode === 'tone') {
            result.push(renderTone(raw));
          } else if (mode === 'notone') {
            result.push(stripTone(raw));
          } else if (mode === 'first') {
            result.push(getFirstLetter(raw));
          }
        } else {
          result.push(ch);
        }
      } else if (/[a-zA-Z0-9]/.test(ch)) {
        result.push(ch);
      } else if (/\s/.test(ch)) {
        result.push(' ');
      } else {
        result.push(ch);
      }
    }
    return result.join(' ');
  }

  function renderTone(pinyin) {
    const toneMap = {
      'a1': 'ā','a2': 'á','a3': 'ǎ','a4': 'à','a0': 'a',
      'e1': 'ē','e2': 'é','e3': 'ě','e4': 'è','e0': 'e',
      'i1': 'ī','i2': 'í','i3': 'ǐ','i4': 'ì','i0': 'i',
      'o1': 'ō','o2': 'ó','o3': 'ǒ','o4': 'ò','o0': 'o',
      'u1': 'ū','u2': 'ú','u3': 'ǔ','u4': 'ù','u0': 'u',
      'v1': 'ǖ','v2': 'ǘ','v3': 'ǚ','v4': 'ǜ','v0': 'ü',
      'n1': 'n','t1': 't' // 这些在结尾处理
    };
    // 简化: 返回带数字的形式, 因为真实声调渲染过于复杂
    // 直接返回拼音, 数字表示声调
    return pinyin;
  }

  document.getElementById('py-convert-btn').addEventListener('click', () => {
    hideError();
    const raw = input.value;
    if (!raw.trim()) { showError('请输入中文文本'); return; }
    const mode = modeSelect.value;
    const output = convertText(raw, mode);
    result.textContent = output;
    outputArea.style.display = 'block';
  });

  document.getElementById('py-clear-btn').addEventListener('click', () => {
    input.value = '';
    result.textContent = '';
    outputArea.style.display = 'none';
    hideError();
  });

  document.getElementById('py-copy-btn').addEventListener('click', () => {
    const text = result.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('py-copy-btn');
      btn.textContent = '已复制！';
      setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const btn = document.getElementById('py-copy-btn');
      btn.textContent = '已复制！';
      setTimeout(() => { btn.textContent = '复制结果'; }, 1500);
    });
  });
