<style>
.lp-search-wrap{margin-bottom:18px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lp-card{background:var(--bg-primary,#fff);border-radius:14px;border:1px solid var(--border-color,#e5e7eb);padding:18px 20px;transition:all .2s;cursor:default}
.lp-card:hover{border-color:#667eea;box-shadow:0 4px 16px rgba(102,126,234,.1);transform:translateY(-2px)}
[data-theme="dark"] .lp-card:hover{border-color:var(--primary-color,#818cf8)}
.lp-card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lp-abbr{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;font-weight:800;flex-shrink:0;border:2px solid var(--border-color,#e5e7eb)}
.lp-name{font-size:1.05rem;font-weight:700;color:var(--text-primary,#1f2937)}
.lp-codes{font-size:.82rem;color:var(--text-secondary,#4b5563);line-height:1.8}
.lp-code-tag{display:inline-flex;align-items:center;gap:4px;background:var(--bg-secondary,#f3f4f6);border-radius:6px;padding:2px 8px;margin:2px 3px;font-family:monospace;font-size:.8rem;color:var(--text-primary,#1f2937);font-weight:600;border:1px solid var(--border-color,#e5e7eb)}
.lp-city{font-size:.72rem;font-weight:400;color:var(--text-muted,#9ca3af);font-family:inherit}
.lp-special{margin-top:18px}
.lp-section-title{font-size:.9rem;font-weight:700;color:var(--text-muted,#6b7280);margin-bottom:10px;padding-left:4px}
.lp-note{font-size:.76rem;color:var(--text-muted,#9ca3af);margin-top:3px}
.lp-count{font-size:.82rem;color:var(--text-muted,#9ca3af);margin-top:10px}
.lp-empty{padding:40px;text-align:center;color:var(--text-muted,#9ca3af);font-size:.88rem}
</style>

      html+="<div class=\"lp-card\"><div class=\"lp-card-header\"><span class=\"lp-abbr\">"+p.abbr+"</span><span class=\"lp-name\">"+p.name+"</span></div><div class=\"lp-codes\">";
      p.codes.forEach(function(cd){
        html+="<span class=\"lp-code-tag\">"+p.abbr+cd.c+"<span class=\"lp-city\">"+cd.city+"</span></span>";
      });
      html+="</div></div>";
    });
    grid.innerHTML=html;
    countEl.textContent="共 "+filtered.length+" 个省份";

    if(!filter || filter===""){
      special.style.display="";
    }else{
      var q=filter.toLowerCase();
      var showSpecial=(q.indexOf("使")!==-1 || q.indexOf("领")!==-1 || q.indexOf("军")!==-1 || q.indexOf("警")!==-1 || q.indexOf("学")!==-1 || q.indexOf("试")!==-1 || q.indexOf("临")!==-1 || q.indexOf("wj")!==-1 || q.indexOf("空")!==-1 || q.indexOf("海")!==-1);
      special.style.display=showSpecial?"":"none";
    }
  }

  searchInput.addEventListener("input",function(){
    render(this.value.trim());
  });

  render("");
})();
</script>
