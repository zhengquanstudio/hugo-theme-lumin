{{ if .Site.Params.widgets.recentPosts }}
<div class="widget widget-recent-posts">
  <h4 class="widget-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </svg>
    最新文章
  </h4>
  <ul class="recent-posts-list">
    {{ $recentCount := .Site.Params.widgets.recentPostsCount | default 5 }}
    {{ range first $recentCount (where .Site.RegularPages "Type" "in" (slice "post" "posts" "")) }}
    <li class="recent-post-item">
      <a href="{{ .Permalink }}" class="recent-post-link">
        <span class="recent-post-title">{{ .Title }}</span>
        <time class="recent-post-date">{{ .Date.Format "01-02" }}</time>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
