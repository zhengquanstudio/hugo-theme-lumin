{{ if or .widgetEnabled .Site.Params.widgets.calendar }}
<div class="widget widget-calendar">
  <h4 class="widget-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    日历
  </h4>
  <div class="tk-widget-card tk-calendar-card">
    <div class="tk-calendar-body">
      <!-- 左侧：日期详情 -->
      <div class="tk-calendar-left">
        <div class="calendar-row-1">
          <span id="calendar-week">第1周</span>
          <span id="calendar-weekday">周一</span>
        </div>
        <div class="calendar-row-2">
          <span class="calendar-day" id="calendar-day">1</span>
        </div>
        <div class="calendar-row-3">
          <span id="calendar-date">2025年1月</span>
          <span id="calendar-year-day">第1天</span>
        </div>
        <div class="calendar-row-4">
          <span id="calendar-lunar-year">甲辰年</span>
          <span id="calendar-lunar-month">正月</span>
          <span id="calendar-lunar-day">初一</span>
        </div>
      </div>

      <!-- 右侧：迷你日历 -->
      <div class="tk-calendar-right">
        <div class="calendar-mini">
          <div class="calendar-weekdays">
            <span>日</span>
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span>六</span>
          </div>
          <div class="calendar-days" id="calendar-days">
            <!-- 动态生成 -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
