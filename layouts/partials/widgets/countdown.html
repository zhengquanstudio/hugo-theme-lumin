{{ if or .widgetEnabled .Site.Params.widgets.countdown }}
<div class="widget widget-countdown">
  <h4 class="widget-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
    倒计时
  </h4>
  <div class="countdown-card" id="countdown-widget">
    <!-- 进度条区域由 JS 渲染 -->
    <div class="countdown-progress" id="cd-progress"></div>
    <!-- 节日倒计时 -->
    {{ with .Site.Params.countdown.event }}
    <div class="countdown-event" data-date="{{ .date }}">
      <span class="countdown-event-name">{{ .name }}</span>
      <div class="countdown-event-days">--</div>
      <div class="countdown-event-date">{{ .date }}</div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
