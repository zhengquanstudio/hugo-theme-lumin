{{ if and .Site.Params.widgets.newestComments .Site.Params.comments.twikoo.envId }}
<div class="widget widget-newest-comments">
  <h4 class="widget-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    最新评论
  </h4>
  <div class="newest-comments-card">
    <div id="recent-comments-list" class="comments-list">
      <!-- 加载中状态 -->
      <div class="comments-loading">
        <div class="loading-spinner"></div>
        <span>加载中...</span>
      </div>
    </div>
  </div>
</div>

<!-- 传递环境配置给 JavaScript -->
<script id="recent-comments-config" type="application/json">
{
  "envId": "{{ .Site.Params.comments.twikoo.envId }}",
  "pageSize": {{ .Site.Params.widgets.newestCommentsCount | default 5 }},
  "totalSize": {{ .Site.Params.widgets.newestCommentsTotalSize | default 50 }}
}
</script>

<!-- 加载 Twikoo 库（如果尚未加载） -->
<script>
(function() {
  if (typeof twikoo === 'undefined') {
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.7.7/dist/twikoo.all.min.js';
    script.onerror = function() {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/twikoo@1.7.7/dist/twikoo.all.min.js';
      document.head.appendChild(s);
    };
    document.head.appendChild(script);
  }
})();
</script>
{{ end }}
