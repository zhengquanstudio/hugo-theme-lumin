{{ if site.Params.reward.enable }}
<style>
.post-reward {
  position: relative;
  margin-top: 2rem;
  width: 100%;
  text-align: center;
}

.post-reward .reward-text {
  margin-bottom: 1rem;
  color: var(--text-secondary, #6b7280);
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* ====== 打赏按钮样式 ====== */
.post-reward .reward-button {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 2rem;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
  user-select: none;
  outline: none;
  position: relative;
  overflow: hidden;
}

.post-reward .reward-button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.post-reward .reward-button:active::before {
  width: 300px;
  height: 300px;
}

.post-reward .reward-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
}

.post-reward .reward-button:active {
  transform: translateY(0);
  box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
}

/* 展开状态的按钮 */
.post-reward .reward-button.active {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  box-shadow: 0 4px 14px rgba(245, 87, 108, 0.4);
}

.post-reward .reward-button.active:hover {
  box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
}

/* 按钮图标旋转动画 */
.post-reward .reward-button svg {
  transition: transform 0.3s ease;
}

.post-reward .reward-button.active svg {
  transform: rotate(180deg);
}

/* ====== 二维码容器样式 ====== */
.post-reward .reward-main {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  z-index: 100;
  opacity: 0;
  visibility: hidden;
  padding: 0;
  width: auto;
  pointer-events: none;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 展开状态 */
.post-reward.reward-open .reward-main {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

.post-reward .reward-all {
  display: inline-flex;
  gap: 1.5rem;
  margin: 0;
  padding: 1.5rem 2rem;
  background: var(--bg-secondary, #ffffff);
  border-radius: 16px;
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.15),
    0 0 0 1px rgba(0, 0, 0, 0.05);
  list-style: none;
  position: relative;
  backdrop-filter: blur(10px);
}

[data-theme="dark"] .post-reward .reward-all {
  background: var(--bg-tertiary, #1e1e2e);
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.05);
}

/* 底部小三角箭头 */
.post-reward .reward-all::after {
  position: absolute;
  right: 0;
  bottom: -10px;
  left: 0;
  margin: 0 auto;
  width: 0;
  height: 0;
  border-top: 10px solid var(--bg-secondary, #ffffff);
  border-right: 10px solid transparent;
  border-left: 10px solid transparent;
  content: '';
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.05));
}

[data-theme="dark"] .post-reward .reward-all::after {
  border-top-color: var(--bg-tertiary, #1e1e2e);
}

/* ====== 单个二维码项 ====== */
.post-reward .reward-item {
  display: inline-block;
  list-style-type: none;
  text-align: center;
  animation: rewardItemFadeIn 0.4s ease backwards;
}

.post-reward .reward-item:nth-child(2) {
  animation-delay: 0.1s;
}

@keyframes rewardItemFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.post-reward .reward-item img {
  width: 150px;
  height: 150px;
  border-radius: 12px;
  object-fit: cover;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  border: 2px solid rgba(102, 126, 234, 0.1);
  background: #fff;
  padding: 4px;
}

.post-reward .reward-item img:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.25);
  border-color: rgba(102, 126, 234, 0.3);
}

[data-theme="dark"] .post-reward .reward-item img {
  background: #2d2d3d;
  border-color: rgba(139, 92, 246, 0.2);
}

.post-reward .post-qr-code-desc {
  margin-top: 0.75rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-secondary, #6b7280);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.post-reward .post-qr-code-desc::before {
  content: '💳';
  font-size: 1em;
}

/* ====== 提示文字动画 ====== */
.post-reward .reward-hint {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 12px;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  font-size: 0.75rem;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s ease;
  pointer-events: none;
  z-index: 101;
}

.post-reward .reward-hint.show {
  opacity: 1;
  visibility: visible;
  bottom: calc(100% + 12px);
}

/* ====== 响应式设计 ====== */
@media (max-width: 768px) {
  .post-reward .reward-main {
    position: fixed;
    bottom: auto;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: calc(100% - 32px);
    max-width: 360px;
  }

  .post-reward.reward-open .reward-main {
    transform: translate(-50%, -50%) scale(1);
  }

  .post-reward .reward-all {
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 1.5rem;
  }

  .post-reward .reward-all::after {
    display: none;
  }

  .post-reward .reward-item img {
    width: 180px;
    height: 180px;
  }

  .post-reward .reward-button {
    padding: 0.65rem 1.5rem;
    font-size: 0.9rem;
  }

  /* 移动端遮罩层 */
  .post-reward.reward-open::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 99;
    animation: fadeIn 0.25s ease;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>

<div class="post-reward" id="post-reward">
  <p class="reward-text">
    {{ site.Params.reward.title | default "请作者喝杯咖啡 ☕" }}
  </p>
  
  <button class="reward-button" id="reward-toggle-btn" type="button" aria-label="打赏支持">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span class="btn-text">{{ site.Params.reward.btnText | default "打赏支持" }}</span>
  </button>

  <div class="reward-main" id="reward-qrcode-panel">
    <ul class="reward-all">
      {{ with site.Params.reward.wechat }}
      <li class="reward-item">
        <img src="{{ . }}" alt="微信打赏" class="post-qr-code-img" loading="lazy">
        <div class="post-qr-code-desc">微信支付</div>
      </li>
      {{ end }}
      {{ with site.Params.reward.alipay }}
      <li class="reward-item">
        <img src="{{ . }}" alt="支付宝打赏" class="post-qr-code-img" loading="lazy">
        <div class="post-qr-code-desc">支付宝</div>
      </li>
      {{ end }}
    </ul>
  </div>

  <div class="reward-hint" id="reward-hint">点击按钮查看打赏二维码</div>
</div>

<script>
(function() {
  const container = document.getElementById('post-reward');
  if (!container) return;

  const btn = container.querySelector('#reward-toggle-btn');
  const panel = container.querySelector('#reward-qrcode-panel');
  const hintText = container.querySelector('#reward-hint');
  const btnText = btn.querySelector('.btn-text');

  if (!btn || !panel) return;

  let isOpen = false;

  function toggleReward(e) {
    if (e) e.preventDefault();
    
    isOpen = !isOpen;
    
    if (isOpen) {
      // 展开
      container.classList.add('reward-open');
      btn.classList.add('active');
      btnText.textContent = '收起打赏';
      btn.setAttribute('aria-expanded', 'true');
      
      // 显示提示（首次）
      if (hintText && !sessionStorage.getItem('reward_hint_shown')) {
        hintText.classList.add('show');
        setTimeout(() => {
          hintText.classList.remove('show');
        }, 2000);
        sessionStorage.setItem('reward_hint_shown', 'true');
      }
      
      // 打赏面板已展开
    } else {
      // 收起
      closeReward();
    }
  }

  function closeReward() {
    isOpen = false;
    container.classList.remove('reward-open');
    btn.classList.remove('active');
    btnText.textContent = '{{ site.Params.reward.btnText | default "打赏支持" }}';
    btn.setAttribute('aria-expanded', 'false');
    
    // 打赏面板已收起
  }

  // 点击按钮切换
  btn.addEventListener('click', toggleReward);

  // 点击外部区域关闭
  document.addEventListener('click', function(e) {
    if (isOpen && !container.contains(e.target)) {
      closeReward();
    }
  });

  // ESC 键关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) {
      closeReward();
      btn.focus();
    }
  });

  // 阻止面板内部点击冒泡（避免误关）
  panel.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  // 首次访问显示提示
  if (!sessionStorage.getItem('reward_visited')) {
    setTimeout(() => {
      hintText?.classList.add('show');
      setTimeout(() => {
        hintText?.classList.remove('show');
      }, 2500);
      sessionStorage.setItem('reward_visited', 'true');
    }, 1000);
  }

  // 打赏组件初始化完成（点击模式）
})();
</script>
{{ end }}
