{{/* Search Overlay - 搜索遮罩层 */}}
{{ if site.Params.search.enable }}
<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="搜索文章" aria-hidden="true">
  <div class="search-container">
    <div class="search-header">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="search-input" placeholder="{{ site.Params.search.placeholder | default "搜索文章..." }}" autocomplete="off">
      <kbd class="search-kbd">ESC</kbd>
      <button class="search-close" id="search-close" aria-label="关闭搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="search-hint" id="search-hint">
      <div class="search-hint-item">
        <kbd>↑↓</kbd> 导航
      </div>
      <div class="search-hint-item">
        <kbd>↵</kbd> 打开
      </div>
      <div class="search-hint-item">
        <kbd>ESC</kbd> 关闭
      </div>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>
{{ end }}
