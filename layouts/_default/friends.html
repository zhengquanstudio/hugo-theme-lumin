{{ define "main" }}
<div class="list-page friends-page">
  <header class="list-header">
    <h1 class="list-title">{{ .Title }}</h1>
    {{ with .Description }}
    <p class="list-description">{{ . }}</p>
    {{ end }}
  </header>
  
  <div class="friends-content">
    {{ .Content }}
  </div>
  
  <div class="friends-list">
    {{ range .Site.Data.friends }}
    <a href="{{ .url }}" target="_blank" rel="noopener" class="friend-card">
      <div class="friend-avatar">
        <img src="{{ .avatar }}" alt="{{ .name }}" loading="lazy">
      </div>
      <div class="friend-info">
        <h3 class="friend-name">{{ .name }}</h3>
        <p class="friend-description">{{ .description }}</p>
      </div>
    </a>
    {{ end }}
  </div>
</div>

<style>
.friends-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 32px;
}

.friend-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  background: var(--bg-secondary);
  border-radius: 12px;
  transition: all 0.2s ease;
}

.friend-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.friend-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.friend-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.friend-info {
  flex: 1;
  min-width: 0;
}

.friend-name {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.friend-description {
  font-size: 0.875rem;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>
{{ end }}
