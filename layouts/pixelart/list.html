<style>
/* ===== 像素画页面 ===== */
.main-wrapper:has(#pixelart-page) .container{max-width:100%!important;padding-left:40px!important;padding-right:40px!important}

.pixelart-page{max-width:1480px;margin:0 auto 24px;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* 页面头部 */
.pixelart-page-header{text-align:center;height:160px;max-height:160px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;background:linear-gradient(135deg,#ecfdf5 0%,#d1fae5 50%,#a7f3d0 100%);border-radius:20px;margin-bottom:22px;box-shadow:0 4px 20px rgba(0,0,0,.08);position:relative;border:1px solid rgba(16,185,129,.12)}
.pixelart-page-header::before{content:'';position:absolute;top:-60%;left:-30%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(16,185,129,.08) 0%,transparent 55%);pointer-events:none}
.pixelart-page-title{font-size:2rem;font-weight:800;color:#1e293b;margin:0 0 8px;display:inline-flex;align-items:center;gap:12px;position:relative;z-index:1}
.pixelart-title-icon{font-size:1.4em;color:#10b981;animation:pixelart-icon-bounce 2.5s ease-in-out infinite;display:inline-block}
@keyframes pixelart-icon-bounce{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.08) rotate(5deg)}}
.pixelart-page-subtitle{font-size:.95rem;color:#475569;margin:0;line-height:1.6;position:relative;z-index:1}

/* 工具栏 */
.pixelart-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:16px 22px;background:var(--bg-primary,#fff);border-radius:14px;border:1px solid var(--border-color,#e5e7eb);margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.pixelart-toolbar-group{display:flex;align-items:center;gap:6px}
.pixelart-toolbar-label{font-size:.8rem;font-weight:600;color:var(--text-muted,#9ca3af);margin-right:2px;white-space:nowrap}
.pixelart-toolbar-divider{width:1px;height:24px;background:var(--border-color,#e5e7eb);margin:0 6px}

/* 工具按钮 */
.pixelart-tool-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid rgba(128,128,128,.2);background:var(--bg-primary,#fff);color:var(--text-primary,#1f2937);font-size:14px;cursor:pointer;transition:all .25s ease;display:inline-flex;align-items:center;justify-content:center}
.pixelart-tool-btn:hover:not(.active){border-color:#10b981;color:#10b981;transform:translateY(-2px);box-shadow:0 4px 12px rgba(16,185,129,.15)}
.pixelart-tool-btn.active{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(16,185,129,.35)}

/* 颜色选择 */
.pixelart-color-input{width:36px;height:36px;border-radius:10px;border:1.5px solid rgba(128,128,128,.2);cursor:pointer;padding:2px;background:var(--bg-primary,#fff);transition:all .25s}
.pixelart-color-input:hover{border-color:#10b981;transform:translateY(-2px)}
.pixelart-color-presets{display:flex;gap:4px;flex-wrap:wrap}
.pixelart-color-swatch{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .2s}
.pixelart-color-swatch:hover{transform:scale(1.15);border-color:rgba(0,0,0,.3)}
.pixelart-color-swatch.active{border-color:#1e293b;box-shadow:0 0 0 2px rgba(16,185,129,.4)}

/* 尺寸选择 */
.pixelart-size-select{padding:6px 12px;border-radius:8px;border:1.5px solid rgba(128,128,128,.2);background:var(--bg-primary,#fff);color:var(--text-primary,#1f2937);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s}
.pixelart-size-select:hover{border-color:#10b981}

/* 画布区域 */
.pixelart-canvas-wrapper{background:var(--bg-primary,#fff);border-radius:14px;border:1px solid var(--border-color,#e5e7eb);padding:24px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.03);display:flex;justify-content:center;align-items:center;overflow:auto}
.pixelart-canvas{image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;border:2px solid var(--border-color,#e5e7eb);border-radius:4px;background:#fff;touch-action:none}

/* 操作按钮 */
.pixelart-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.pixelart-action-btn{padding:8px 20px;border-radius:50px;border:1.5px solid rgba(128,128,128,.2);background:var(--bg-primary,#fff);color:var(--text-primary,#1f2937);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .25s ease;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pixelart-action-btn:hover{border-color:#10b981;color:#10b981;transform:translateY(-2px);box-shadow:0 4px 12px rgba(16,185,129,.15)}
.pixelart-action-btn.primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(16,185,129,.35)}
.pixelart-action-btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,185,129,.4)}
.pixelart-action-btn.danger:hover{border-color:#ef4444;color:#ef4444;box-shadow:0 4px 12px rgba(239,68,68,.15)}

/* 暗色模式 */
[data-theme="dark"] .pixelart-page-header{background:linear-gradient(135deg,#022c22 0%,#064e3b 50%,#022c22 100%);border-color:rgba(16,185,129,.2)}
[data-theme="dark"] .pixelart-page-title{color:#f1f5f9}
[data-theme="dark"] .pixelart-page-subtitle{color:#94a3b8}
[data-theme="dark"] .pixelart-toolbar{background:var(--bg-primary,#1e293b);border-color:var(--border-color,#334155)}
[data-theme="dark"] .pixelart-tool-btn{background:rgba(30,41,59,.8);color:#e2e8f0;border-color:rgba(148,163,184,.15)}
[data-theme="dark"] .pixelart-tool-btn:hover:not(.active){border-color:#10b981;color:#10b981}
[data-theme="dark"] .pixelart-tool-btn.active{background:linear-gradient(135deg,#059669,#047857);border-color:transparent}
[data-theme="dark"] .pixelart-color-input{background:rgba(30,41,59,.8);border-color:rgba(148,163,184,.15)}
[data-theme="dark"] .pixelart-size-select{background:rgba(30,41,59,.8);color:#e2e8f0;border-color:rgba(148,163,184,.15)}
[data-theme="dark"] .pixelart-canvas-wrapper{background:var(--bg-primary,#1e293b);border-color:var(--border-color,#334155)}
[data-theme="dark"] .pixelart-canvas{border-color:var(--border-color,#334155);background:#1e293b}
[data-theme="dark"] .pixelart-action-btn{background:rgba(30,41,59,.8);color:#e2e8f0;border-color:rgba(148,163,184,.15)}
[data-theme="dark"] .pixelart-action-btn:hover{border-color:#10b981;color:#10b981}
[data-theme="dark"] .pixelart-action-btn.primary{background:linear-gradient(135deg,#059669,#047857);color:#fff;border-color:transparent}
[data-theme="dark"] .pixelart-action-btn.danger:hover{border-color:#ef4444;color:#ef4444}

/* 响应式 */
@media(max-width:900px){
  .main-wrapper:has(#pixelart-page) .container{padding-left:16px!important;padding-right:16px!important}
  .pixelart-page-header{padding:26px 16px 20px;height:160px;max-height:160px}
  .pixelart-page-title{font-size:1.65rem}
  .pixelart-toolbar{padding:12px 16px;gap:8px}
  .pixelart-canvas-wrapper{padding:16px}
}
@media(max-width:600px){
  .main-wrapper:has(#pixelart-page) .container{padding-left:12px!important;padding-right:12px!important}
  .pixelart-page-header{padding:22px 12px 16px;height:140px;max-height:140px}
  .pixelart-page-title{font-size:1.4rem}
  .pixelart-toolbar{padding:10px 12px;gap:6px}
  .pixelart-canvas-wrapper{padding:12px}
}
</style>

<div class="pixelart-page" id="pixelart-page">
  <div class="pixelart-page-header">
    <h1 class="pixelart-page-title"><span class="pixelart-title-icon"><i class="fas fa-th"></i></span> 像素画</h1>
    <p class="pixelart-page-subtitle">用像素创造你的艺术，在线像素画绘制工具</p>
  </div>

  <!-- 工具栏 -->
  <div class="pixelart-toolbar">
    <div class="pixelart-toolbar-group">
      <span class="pixelart-toolbar-label">工具</span>
      <button class="pixelart-tool-btn active" data-tool="pen" title="画笔"><i class="fas fa-pen"></i></button>
      <button class="pixelart-tool-btn" data-tool="eraser" title="橡皮擦"><i class="fas fa-eraser"></i></button>
      <button class="pixelart-tool-btn" data-tool="fill" title="填充"><i class="fas fa-fill-drip"></i></button>
      <button class="pixelart-tool-btn" data-tool="picker" title="取色器"><i class="fas fa-eye-dropper"></i></button>
    </div>
    <div class="pixelart-toolbar-divider"></div>
    <div class="pixelart-toolbar-group">
      <span class="pixelart-toolbar-label">颜色</span>
      <input type="color" class="pixelart-color-input" id="pixelart-color" value="#1e293b">
      <div class="pixelart-color-presets" id="pixelart-presets"></div>
    </div>
    <div class="pixelart-toolbar-divider"></div>
    <div class="pixelart-toolbar-group">
      <span class="pixelart-toolbar-label">画布</span>
      <select class="pixelart-size-select" id="pixelart-grid-size">
        <option value="16">16 × 16</option>
        <option value="24">24 × 24</option>
        <option value="32" selected>32 × 32</option>
        <option value="48">48 × 48</option>
        <option value="64">64 × 64</option>
      </select>
    </div>
  </div>

  <!-- 画布 -->
  <div class="pixelart-canvas-wrapper">
    <canvas class="pixelart-canvas" id="pixelart-canvas"></canvas>
  </div>

  <!-- 操作按钮 -->
  <div class="pixelart-actions">
    <button class="pixelart-action-btn" id="pixelart-undo" title="撤销"><i class="fas fa-undo"></i> 撤销</button>
    <button class="pixelart-action-btn" id="pixelart-redo" title="重做"><i class="fas fa-redo"></i> 重做</button>
    <button class="pixelart-action-btn" id="pixelart-grid-toggle" title="网格"><i class="fas fa-border-all"></i> 网格</button>
    <button class="pixelart-action-btn danger" id="pixelart-clear" title="清空"><i class="fas fa-trash-alt"></i> 清空</button>
    <button class="pixelart-action-btn primary" id="pixelart-export" title="导出PNG"><i class="fas fa-download"></i> 导出 PNG</button>
  </div>

  <!-- 评论区 -->
  {{ partial "comments.html" . }}
</div>

<script>
(function(){
  // ===== 配置 =====
  var PRESETS = [
    '#1e293b','#ef4444','#f97316','#eab308','#22c55e','#10b981',
    '#06b6d4','#3b82f6','#6366f1','#8b5cf6','#ec4899','#f43f5e',
    '#ffffff','#94a3b8','#64748b','#334155','#000000','#78350f'
  ];

  // ===== 状态 =====
  var gridSize = 32;
  var pixelSize = 16;
  var currentColor = '#1e293b';
  var currentTool = 'pen';
  var showGrid = true;
  var isDrawing = false;
  var pixels = [];
  var undoStack = [];
  var redoStack = [];
  var maxHistory = 50;

  // ===== DOM =====
  var canvas = document.getElementById('pixelart-canvas');
  var ctx = canvas.getContext('2d');
  var colorInput = document.getElementById('pixelart-color');
  var sizeSelect = document.getElementById('pixelart-grid-size');
  var presetsDiv = document.getElementById('pixelart-presets');

  // ===== 初始化 =====
  function init(){
    buildPresets();
    resetPixels();
    resizeCanvas();
    render();
    bindEvents();
  }

  function buildPresets(){
    presetsDiv.innerHTML = '';
    PRESETS.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'pixelart-color-swatch';
      el.style.background = c;
      if(c === '#ffffff') el.style.border = '2px solid #d1d5db';
      el.dataset.color = c;
      if(c === currentColor) el.classList.add('active');
      presetsDiv.appendChild(el);
    });
  }

  function resetPixels(){
    pixels = [];
    for(var y = 0; y < gridSize; y++){
      pixels[y] = [];
      for(var x = 0; x < gridSize; x++){
        pixels[y][x] = null;
      }
    }
    undoStack = [];
    redoStack = [];
  }

  function resizeCanvas(){
    // 计算合适的像素大小
    var wrapper = canvas.parentElement;
    var maxW = wrapper.clientWidth - 48;
    pixelSize = Math.max(4, Math.floor(maxW / gridSize));
    pixelSize = Math.min(pixelSize, 20);
    canvas.width = gridSize * pixelSize;
    canvas.height = gridSize * pixelSize;
  }

  // ===== 渲染 =====
  function render(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 画棋盘格背景（表示透明）
    for(var y = 0; y < gridSize; y++){
      for(var x = 0; x < gridSize; x++){
        var px = x * pixelSize;
        var py = y * pixelSize;
        // 棋盘格
        if((x + y) % 2 === 0){
          ctx.fillStyle = '#f8f9fa';
        } else {
          ctx.fillStyle = '#e9ecef';
        }
        ctx.fillRect(px, py, pixelSize, pixelSize);

        // 像素颜色
        if(pixels[y][x]){
          ctx.fillStyle = pixels[y][x];
          ctx.fillRect(px, py, pixelSize, pixelSize);
        }
      }
    }

    // 网格线
    if(showGrid && pixelSize >= 6){
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 0.5;
      for(var i = 0; i <= gridSize; i++){
        ctx.beginPath();
        ctx.moveTo(i * pixelSize, 0);
        ctx.lineTo(i * pixelSize, gridSize * pixelSize);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * pixelSize);
        ctx.lineTo(gridSize * pixelSize, i * pixelSize);
        ctx.stroke();
      }
    }
  }

  // ===== 历史记录 =====
  function saveState(){
    var state = pixels.map(function(row){ return row.slice(); });
    undoStack.push(state);
    if(undoStack.length > maxHistory) undoStack.shift();
    redoStack = [];
  }

  function undo(){
    if(undoStack.length === 0) return;
    var state = pixels.map(function(row){ return row.slice(); });
    redoStack.push(state);
    pixels = undoStack.pop();
    render();
  }

  function redo(){
    if(redoStack.length === 0) return;
    var state = pixels.map(function(row){ return row.slice(); });
    undoStack.push(state);
    pixels = redoStack.pop();
    render();
  }

  // ===== 绘制操作 =====
  function getPixelCoord(e){
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var x, y;
    if(e.touches){
      x = (e.touches[0].clientX - rect.left) * scaleX;
      y = (e.touches[0].clientY - rect.top) * scaleY;
    } else {
      x = (e.clientX - rect.left) * scaleX;
      y = (e.clientY - rect.top) * scaleY;
    }
    return {
      x: Math.floor(x / pixelSize),
      y: Math.floor(y / pixelSize)
    };
  }

  function drawPixel(x, y){
    if(x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;
    if(currentTool === 'pen'){
      pixels[y][x] = currentColor;
    } else if(currentTool === 'eraser'){
      pixels[y][x] = null;
    }
    render();
  }

  function floodFill(startX, startY, fillColor){
    if(startX < 0 || startX >= gridSize || startY < 0 || startY >= gridSize) return;
    var targetColor = pixels[startY][startX];
    if(targetColor === fillColor) return;
    var stack = [[startX, startY]];
    var visited = {};
    while(stack.length > 0){
      var pos = stack.pop();
      var px = pos[0], py = pos[1];
      if(px < 0 || px >= gridSize || py < 0 || py >= gridSize) continue;
      var key = px + ',' + py;
      if(visited[key]) continue;
      if(pixels[py][px] !== targetColor) continue;
      visited[key] = true;
      pixels[py][px] = fillColor;
      stack.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
    }
    render();
  }

  function pickColor(x, y){
    if(x < 0 || x >= gridSize || y < 0 || y >= gridSize) return;
    var c = pixels[y][x];
    if(c){
      currentColor = c;
      colorInput.value = c;
      updateSwatchActive();
    }
  }

  function updateSwatchActive(){
    var swatches = presetsDiv.querySelectorAll('.pixelart-color-swatch');
    for(var i = 0; i < swatches.length; i++){
      swatches[i].classList.toggle('active', swatches[i].dataset.color === currentColor);
    }
  }

  // ===== 事件绑定 =====
  function bindEvents(){
    // 画布鼠标事件
    canvas.addEventListener('mousedown', function(e){
      e.preventDefault();
      var coord = getPixelCoord(e);
      if(currentTool === 'fill'){
        saveState();
        floodFill(coord.x, coord.y, currentColor);
      } else if(currentTool === 'picker'){
        pickColor(coord.x, coord.y);
      } else {
        saveState();
        isDrawing = true;
        drawPixel(coord.x, coord.y);
      }
    });
    canvas.addEventListener('mousemove', function(e){
      if(!isDrawing) return;
      var coord = getPixelCoord(e);
      drawPixel(coord.x, coord.y);
    });
    document.addEventListener('mouseup', function(){ isDrawing = false; });

    // 触摸事件
    canvas.addEventListener('touchstart', function(e){
      e.preventDefault();
      var coord = getPixelCoord(e);
      if(currentTool === 'fill'){
        saveState();
        floodFill(coord.x, coord.y, currentColor);
      } else if(currentTool === 'picker'){
        pickColor(coord.x, coord.y);
      } else {
        saveState();
        isDrawing = true;
        drawPixel(coord.x, coord.y);
      }
    }, {passive: false});
    canvas.addEventListener('touchmove', function(e){
      e.preventDefault();
      if(!isDrawing) return;
      var coord = getPixelCoord(e);
      drawPixel(coord.x, coord.y);
    }, {passive: false});
    canvas.addEventListener('touchend', function(){ isDrawing = false; });

    // 工具按钮
    var toolBtns = document.querySelectorAll('.pixelart-tool-btn');
    toolBtns.forEach(function(btn){
      btn.addEventListener('click', function(){
        toolBtns.forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
      });
    });

    // 颜色选择
    colorInput.addEventListener('input', function(){
      currentColor = this.value;
      updateSwatchActive();
    });
    presetsDiv.addEventListener('click', function(e){
      var swatch = e.target.closest('.pixelart-color-swatch');
      if(!swatch) return;
      currentColor = swatch.dataset.color;
      colorInput.value = currentColor;
      updateSwatchActive();
    });

    // 画布大小
    sizeSelect.addEventListener('change', function(){
      gridSize = parseInt(this.value);
      resetPixels();
      resizeCanvas();
      render();
    });

    // 撤销/重做
    document.getElementById('pixelart-undo').addEventListener('click', undo);
    document.getElementById('pixelart-redo').addEventListener('click', redo);

    // 网格切换
    document.getElementById('pixelart-grid-toggle').addEventListener('click', function(){
      showGrid = !showGrid;
      this.classList.toggle('active', showGrid);
      render();
    });

    // 清空
    document.getElementById('pixelart-clear').addEventListener('click', function(){
      if(!confirm('确定要清空画布吗？')) return;
      saveState();
      resetPixels();
      // keep undoStack after resetPixels clears it
      render();
    });

    // 导出PNG
    document.getElementById('pixelart-export').addEventListener('click', function(){
      var exportCanvas = document.createElement('canvas');
      var scale = 16;
      exportCanvas.width = gridSize * scale;
      exportCanvas.height = gridSize * scale;
      var ectx = exportCanvas.getContext('2d');
      // 透明背景
      for(var y = 0; y < gridSize; y++){
        for(var x = 0; x < gridSize; x++){
          if(pixels[y][x]){
            ectx.fillStyle = pixels[y][x];
            ectx.fillRect(x * scale, y * scale, scale, scale);
          }
        }
      }
      var link = document.createElement('a');
      link.download = 'pixelart-' + gridSize + 'x' + gridSize + '-' + Date.now() + '.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    // 键盘快捷键
    document.addEventListener('keydown', function(e){
      if(e.ctrlKey && e.key === 'z'){ e.preventDefault(); undo(); }
      if(e.ctrlKey && e.key === 'y'){ e.preventDefault(); redo(); }
    });

    // 窗口resize
    window.addEventListener('resize', function(){
      resizeCanvas();
      render();
    });
  }

  init();
})();
</script>
{{ end }}
