{{ define "main" }}
<style>
/* ===== 3D 地球旅行足迹页面 ===== */
.main-wrapper:has(#globe-page) .container{max-width:100%!important;padding-left:12px!important;padding-right:12px!important}

.globe-page{max-width:1480px;margin:0 auto 16px;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

.globe-page-header{text-align:center;height:160px;max-height:160px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;background:linear-gradient(135deg,#0a0a1a 0%,#0d1b2a 50%,#0a0a1a 100%);border-radius:20px;margin-bottom:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);position:relative;border:1px solid rgba(56,189,248,.12)}
.globe-page-header::before{content:'';position:absolute;top:-60%;left:-30%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(56,189,248,.08) 0%,transparent 55%);pointer-events:none}
.globe-page-title{font-size:1.7rem;font-weight:800;color:#e2e8f0;margin:0 0 4px;display:inline-flex;align-items:center;gap:10px;position:relative;z-index:1}
.globe-title-icon{font-size:1.3em;color:#38bdf8;animation:globe-icon-pulse 3s ease-in-out infinite;display:inline-block}
@keyframes globe-icon-pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(56,189,248,.4))}50%{filter:drop-shadow(0 0 14px rgba(56,189,248,.8))}}
.globe-page-subtitle{font-size:.85rem;color:#64748b;margin:0;line-height:1.4;position:relative;z-index:1}

.globe-container{position:relative;width:100%;height:calc(100vh - 240px);min-height:500px;border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at center,#0d1b2a 0%,#020617 100%);box-shadow:0 4px 30px rgba(0,0,0,.4);border:1px solid rgba(56,189,248,.06);cursor:grab}
.globe-container:active{cursor:grabbing}
.globe-container canvas{display:block}
.globe-loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#94a3b8;font-size:.95rem;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px}
.globe-loading-spinner{width:36px;height:36px;border:3px solid rgba(56,189,248,.15);border-top-color:#38bdf8;border-radius:50%;animation:globe-spin 1s linear infinite}
@keyframes globe-spin{to{transform:rotate(360deg)}}
.globe-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.6);border-radius:20px;font-size:.78rem;z-index:2;pointer-events:none;backdrop-filter:blur(8px);transition:opacity .8s;letter-spacing:.3px}
.globe-hint.fade{opacity:0}

[data-theme="dark"] .globe-page-header{background:linear-gradient(135deg,#020617 0%,#0a1628 50%,#020617 100%);border-color:rgba(56,189,248,.18)}

@media(max-width:900px){
  .main-wrapper:has(#globe-page) .container{padding-left:10px!important;padding-right:10px!important}
  .globe-page-header{height:160px;max-height:160px;padding:26px 18px}
  .globe-page-title{font-size:1.4rem}
  .globe-container{height:calc(100vh - 230px);min-height:400px;border-radius:16px}
}
@media(max-width:600px){
  .main-wrapper:has(#globe-page) .container{padding-left:6px!important;padding-right:6px!important}
  .globe-page-header{height:140px;max-height:140px;padding:20px 14px;margin-bottom:8px;border-radius:14px}
  .globe-page-title{font-size:1.2rem}
  .globe-container{height:calc(100vh - 130px);min-height:350px;border-radius:12px}
}
</style>

<div class="globe-page" id="globe-page">
  <div class="globe-page-header">
    <h1 class="globe-page-title"><span class="globe-title-icon"><i class="fas fa-globe-americas"></i></span> 3D 地球旅行足迹</h1>
    <p class="globe-page-subtitle">拖拽旋转 · 滚轮缩放 · 国家分界线 · 记录走过的每一个地方</p>
  </div>

  <div class="globe-container" id="globe-container">
    <div class="globe-loading" id="globe-loading">
      <div class="globe-loading-spinner"></div>
      <span id="globe-loading-text">加载地球中...</span>
    </div>
    <div class="globe-hint" id="globe-hint">🖱️ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放</div>
  </div>

  {{ partial "comments.html" . }}
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function(){
  var container = document.getElementById('globe-container');
  var loading = document.getElementById('globe-loading');
  var loadingText = document.getElementById('globe-loading-text');
  var hintEl = document.getElementById('globe-hint');
  if (!container) return;

  // ===== Three.js 初始化 =====
  var W = container.clientWidth;
  var H = container.clientHeight;

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(40, W/H, 0.1, 1000);
  camera.position.set(0, 0.5, 3.5);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // ===== 星空背景 =====
  var starsGeo = new THREE.BufferGeometry();
  var starsCount = 2500;
  var starsPos = new Float32Array(starsCount * 3);
  for (var i = 0; i < starsCount; i++) {
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.acos(2 * Math.random() - 1);
    var r = 18 + Math.random() * 35;
    starsPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    starsPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    starsPos[i*3+2] = r * Math.cos(phi);
  }
  starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
  var starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false });
  var stars = new THREE.Points(starsGeo, starsMat);
  scene.add(stars);

  // ===== 地球组 =====
  var earthGroup = new THREE.Group();
  scene.add(earthGroup);
  var R = 1; // 地球半径

  // 海洋底色球体
  var oceanGeo = new THREE.SphereGeometry(R, 72, 72);
  var oceanMat = new THREE.MeshPhongMaterial({ color: 0x0a1628, emissive: 0x020a14, shininess: 0 });
  var ocean = new THREE.Mesh(oceanGeo, oceanMat);
  earthGroup.add(ocean);

  // ===== 大气层光晕 =====
  var atmosGeo = new THREE.SphereGeometry(R * 1.015, 72, 72);
  var atmosMat = new THREE.ShaderMaterial({
    vertexShader: 'varying vec3 vNormal; varying vec3 vPosition; void main() { vNormal = normalize(normalMatrix * normal); vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec3 vNormal; varying vec3 vPosition; void main() { vec3 viewDir = normalize(-vPosition); float intensity = pow(0.62 - dot(vNormal, viewDir), 3.5); gl_FragColor = vec4(0.22, 0.72, 0.98, intensity * 0.22); }',
    blending: THREE.AdditiveBlending, side: THREE.FrontSide, transparent: true, depthWrite: false
  });
  var atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
  earthGroup.add(atmosphere);

  // ===== 光照 =====
  scene.add(new THREE.AmbientLight(0x334466, 2.0));
  var sun = new THREE.DirectionalLight(0xffffff, 2.8);
  sun.position.set(5, 2, 5);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x224488, 0.6);
  fill.position.set(-3, -1, -3);
  scene.add(fill);

  // ===== 经纬度 → 3D 坐标 =====
  function latLngToVec3(lat, lng, radius) {
    var phi = (90 - lat) * Math.PI / 180;
    var theta = (lng + 180) * Math.PI / 180;
    return new THREE.Vector3(
      -radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  // ===== 绘制 GeoJSON 国界线 =====
  var borderGroup = new THREE.Group();
  earthGroup.add(borderGroup);
  var fillGroup = new THREE.Group();
  earthGroup.add(fillGroup);
  var borderRadius = R * 1.002;  // 略高于球面

  function drawCountryBoundaries(geojson) {
    var features = geojson.features || [];
    var total = features.length;
    if (loadingText) loadingText.textContent = '绘制国家分界线...';

    for (var f = 0; f < features.length; f++) {
      var feature = features[f];
      var geom = feature.geometry;
      if (!geom) continue;

      var coords = [];
      if (geom.type === 'Polygon') {
        coords = geom.coordinates;
      } else if (geom.type === 'MultiPolygon') {
        coords = geom.coordinates;
      }

      for (var p = 0; p < coords.length; p++) {
        var polygon = coords[p];
        // 外环 + 内环（洞）
        for (var r = 0; r < polygon.length; r++) {
          var ring = polygon[r];
          if (ring.length < 2) continue;

          // 简化采样（每隔 N 个点取一个）
          var step = Math.max(1, Math.floor(ring.length / 200));
          var points = [];
          for (var j = 0; j < ring.length; j += step) {
            points.push(latLngToVec3(ring[j][1], ring[j][0], borderRadius));
          }
          // 确保首尾相连
          if (points.length > 1) {
            var last = latLngToVec3(ring[ring.length-1][1], ring[ring.length-1][0], borderRadius);
            points.push(last);
          }

          if (points.length < 2) continue;

          // 创建 LineSegments
          var lineGeo = new THREE.BufferGeometry();
          var vertices = [];
          for (var k = 0; k < points.length - 1; k++) {
            vertices.push(points[k].x, points[k].y, points[k].z);
            vertices.push(points[k+1].x, points[k+1].y, points[k+1].z);
          }
          lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
          var color = r === 0 ? 0x3a6a96 : 0x2a4a6a;
          var lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.55, depthTest: true });
          borderGroup.add(new THREE.LineSegments(lineGeo, lineMat));
        }
      }

      // 进度提示
      if (f % 30 === 0 && loadingText) {
        loadingText.textContent = '绘制国家分界线... ' + Math.round(f/total*100) + '%';
      }
    }
  }

  // ===== 轨道控制 =====
  var isDragging = false;
  var prevMouse = { x: 0, y: 0 };
  var rotation = { x: 0.35, y: 0 };
  var targetRotation = { x: 0.35, y: 0 };
  var zoom = 3.5;
  var targetZoom = 3.5;
  var autoRotate = true;
  var autoRotateSpeed = 0.12;

  function updateCamera() {
    rotation.x += (targetRotation.x - rotation.x) * 0.08;
    rotation.y += (targetRotation.y - rotation.y) * 0.08;
    zoom += (targetZoom - zoom) * 0.08;
    rotation.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, rotation.x));
    var phi = rotation.x, theta = rotation.y, r = zoom;
    camera.position.set(
      r * Math.cos(phi) * Math.sin(theta),
      r * Math.sin(phi),
      r * Math.cos(phi) * Math.cos(theta)
    );
    camera.lookAt(0, 0, 0);
  }

  container.addEventListener('mousedown', function(e) {
    isDragging = true; autoRotate = false;
    prevMouse.x = e.clientX; prevMouse.y = e.clientY;
  });
  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
    targetRotation.y += dx * 0.005; targetRotation.x += dy * 0.005;
    prevMouse.x = e.clientX; prevMouse.y = e.clientY;
  });
  window.addEventListener('mouseup', function() {
    isDragging = false;
    clearTimeout(window._globeIdle);
    window._globeIdle = setTimeout(function() { autoRotate = true; }, 2000);
  });
  container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      isDragging = true; autoRotate = false;
      prevMouse.x = e.touches[0].clientX; prevMouse.y = e.touches[0].clientY;
    }
  }, { passive: false });
  container.addEventListener('touchmove', function(e) {
    if (!isDragging || e.touches.length !== 1) return;
    e.preventDefault();
    var dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
    targetRotation.y += dx * 0.005; targetRotation.x += dy * 0.005;
    prevMouse.x = e.touches[0].clientX; prevMouse.y = e.touches[0].clientY;
  }, { passive: false });
  container.addEventListener('touchend', function() {
    isDragging = false;
    clearTimeout(window._globeIdle);
    window._globeIdle = setTimeout(function() { autoRotate = true; }, 2000);
  });
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    targetZoom += e.deltaY * 0.002;
    targetZoom = Math.max(1.6, Math.min(8, targetZoom));
    if (hintEl) hintEl.classList.add('fade');
  }, { passive: false });
  container.addEventListener('dblclick', function() {
    targetRotation.x = 0.35; targetRotation.y = 0; targetZoom = 3.5; autoRotate = true;
  });
  window.addEventListener('resize', function() {
    W = container.clientWidth; H = container.clientHeight;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
  setTimeout(function() { if (hintEl) hintEl.classList.add('fade'); }, 10000);

  // ===== 渲染循环 =====
  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate && !isDragging) targetRotation.y += autoRotateSpeed * 0.005;
    updateCamera();
    stars.rotation.y += 0.0001; stars.rotation.x += 0.00005;
    renderer.render(scene, camera);
  }
  animate();

  // ===== 加载国界线数据 =====
  if (loadingText) loadingText.textContent = '加载地理数据...';

  // 使用 world-atlas TopoJSON → 转为 GeoJSON
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(function(r) { return r.json(); })
    .then(function(topology) {
      if (loadingText) loadingText.textContent = '解析国家边界...';
      // topojson-client 的 feature() 方法
      var geojson = topojson.feature(topology, topology.objects.countries);
      drawCountryBoundaries(geojson);
      // 隐藏 loading
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity .5s';
        setTimeout(function() { loading.style.display = 'none'; }, 500);
      }
    })
    .catch(function(err) {
      console.warn('[Globe] Failed to load boundaries:', err);
      if (loadingText) loadingText.textContent = '国界数据加载失败，显示基础地球';
      setTimeout(function() {
        if (loading) { loading.style.opacity = '0'; loading.style.transition = 'opacity .5s'; }
      }, 2000);
    });
})();
</script>
{{ end }}
