# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Lumin"
license = "MIT"
licenselink = "https://github.com/yourname/hugo-theme-lumin/blob/main/LICENSE"
description = "A modern, elegant Hugo blog theme with dark/light mode, sidebar widgets, and rich features"
homepage = "https://github.com/yourname/hugo-theme-lumin"
demosite = "https://demo.lumin-theme.com"
tags = ["blog", "responsive", "dark", "light", "sidebar", "multilingual", "search", "gallery", "diary"]
features = ["dark-mode", "sidebar", "search", "gallery", "diary", "movies", "music", "friends", "comments", "reward"]
min_version = "0.100.0"

[author]
  name = "Lumin Team"
  homepage = "https://github.com/yourname"

[original]
  name = "onedayxyy.cn"
  homepage = "https://onedayxyy.cn/"
